name: ANALYST_INGEST_DAILY

# Daily ingest of UW /screener/analysts -> analyst_ratings_daily.
# Walks the v5 universe ticker-by-ticker. ~3,500 tickers * 0.4s = ~25 min.

on:
  schedule:
    - cron: '20 10 * * 1-5'    # 06:20 ET EDT
    - cron: '20 11 * * 1-5'    # 06:20 ET EST
  workflow_dispatch:
    inputs:
      limit:
        description: "Only ingest first N tickers (testing)"
        required: false
      tickers:
        description: "Comma-separated explicit ticker list (overrides universe)"
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run-slot gate — ET window + once-per-day ledger check
        # Replaces the exact-hour DST guard (PR #828). That guard required the
        # runner to START inside one specific ET hour, but GitHub's cron
        # routinely delivers 1-4 hours late, so every scheduled run from
        # 2026-05-26 to 2026-06-10 skipped and this feed silently flatlined
        # while reporting green. Two rules now decide whether this fire runs:
        #   1. WINDOW — run only if the current ET hour is inside [EXPECTED,
        #      EXPECTED+4]. Late cron delivery is tolerated; the wrong-DST
        #      cron line (1h early in winter) is still rejected; anything
        #      more than 4h late is abandoned to tomorrow's slot.
        #   2. LEDGER — skip if api_usage_log already holds a success row for
        #      this feed since ET midnight (every real run writes one on
        #      completion). This is what prevents a double-run when both DST
        #      cron lines land inside the window. Fail-open: if the ledger
        #      query errors, proceed — every ingest here is an idempotent
        #      upsert, so a duplicate pass wastes API calls but cannot
        #      corrupt data, and a feed that runs twice is far better than a
        #      feed that never runs.
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          EXPECTED=6
          SOURCE='analyst_ratings'
          ET_HOUR=$(TZ=America/New_York date +%-H)
          LO=$EXPECTED; HI=$((EXPECTED+4))
          if [ "$ET_HOUR" -lt "$LO" ] || [ "$ET_HOUR" -gt "$HI" ]; then
            echo "::notice::ET hour $ET_HOUR is outside the run window ${LO}:00-${HI}:59. Skipping."
            echo "SKIP_RUN=true" >> "$GITHUB_ENV"
            exit 0
          fi
          ET_MIDNIGHT=$(TZ=America/New_York date -d 'today 00:00' --iso-8601=seconds)
          ROWS=$(curl -sf -G "$SUPABASE_URL/rest/v1/api_usage_log" \
            --data-urlencode "select=id" \
            --data-urlencode "source=eq.$SOURCE" \
            --data-urlencode "status=eq.success" \
            --data-urlencode "started_at=gte.$ET_MIDNIGHT" \
            --data-urlencode "limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" || echo "")
          if [ -n "$ROWS" ] && [ "$ROWS" != "[]" ]; then
            echo "::notice::$SOURCE already ran successfully today (ET) — this is the redundant DST line. Skipping."
            echo "SKIP_RUN=true" >> "$GITHUB_ENV"
          else
            echo "OK: in window (ET hour $ET_HOUR) and no successful $SOURCE run yet today — proceeding."
          fi

      - uses: actions/checkout@v4
        if: env.SKIP_RUN != 'true'
      - uses: actions/setup-python@v5
        if: env.SKIP_RUN != 'true'
        with:
          python-version: '3.11'

      - name: Install scanner deps
        if: env.SKIP_RUN != 'true'
        working-directory: trading-scanner
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run ingest
        if: env.SKIP_RUN != 'true'
        working-directory: trading-scanner
        env:
          UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY }}
          UW_CLIENT_API_ID: ${{ secrets.UW_CLIENT_API_ID || '100001' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="--limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.tickers }}" ]; then ARGS="--tickers ${{ inputs.tickers }}"; fi
          PYTHONPATH=. python3 -m scanner.signal_intelligence_v5.analyst_ingest \
            --max-seconds 2400 $ARGS

      - name: Surface row count
        if: env.SKIP_RUN != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                  -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                  -H "Prefer: count=exact" \
                  "$SUPABASE_URL/rest/v1/analyst_ratings_daily?select=ticker&limit=1" \
                  -I 2>&1 | grep -i content-range || true
