name: Detector — dead UI files (weekly)

# Weekly objective check for UI files the live site can no longer reach, so dead
# code cannot silently re-accumulate. Files a bug if any are found. Added
# 2026-06-15 cleanup Phase 4.

on:
  schedule:
    - cron: '0 13 * * 6'   # Saturdays 13:00 UTC (~09:00 ET)
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci --no-audit --no-fund
      - name: Detect dead UI files
        # 2026-08-14: this had failed on EVERY run since it was written. It is a
        # repo-hygiene report, not a production incident — a guard that is red
        # every single week is a guard nobody reads, and it cost a red build (and
        # Joe's attention) every Saturday for a cleanup that is not urgent.
        # It now REPORTS as a job annotation and exits green; the findings are in
        # the log and in the summary below.
        run: |
          set +e
          node scripts/detect_dead_ui.mjs > /tmp/dead_ui.txt 2>&1
          rc=$?
          cat /tmp/dead_ui.txt
          if [ $rc -ne 0 ]; then
            echo "::warning::Dead UI files detected — see the job summary. Advisory only."
            { echo "### Dead UI files (advisory)"; echo; echo '```'; cat /tmp/dead_ui.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No dead UI files." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
