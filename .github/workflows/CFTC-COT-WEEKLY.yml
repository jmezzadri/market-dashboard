# CFTC-COT-WEEKLY — weekly futures positioning for the Macro Overview tiles.
#
# WHY
# ───
# Every Friday 15:30 ET the CFTC publishes Commitments of Traders (as of the
# prior Tuesday). This job pulls it Saturday morning, ranks each market's
# speculator + commercial-hedger net position into its own 3-year range, and
# writes the bucketed public/cot_positioning.json the asset-class tiles read.
#
# SCHEDULE
# ────────
# Saturday 11:00 UTC (07:00 ET) — after the Friday CFTC release.
#
# OUTPUTS
# ───────
# public/cot_positioning.json (+ manifest freshness stamp for
# indicator-cftc-cot-weekly). Free source (CFTC public reporting); no key.

name: CFTC-COT-WEEKLY

on:
  schedule:
    - cron: "0 11 * * 6"        # Saturday 11:00 UTC = 07:00 ET
  workflow_dispatch: {}

concurrency:
  group: cftc-cot-weekly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MACROTILT_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas numpy
      - name: Build cross-asset positioning file
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # -u (2026-08-31): the 8/29 timeout kill left a log with ZERO output
        # from this step, because python block-buffers stdout when it is not a
        # tty and the buffer dies with the process. A hang we cannot locate is
        # a hang we cannot fix; unbuffered, the last line printed is the answer.
        run: python3 -u scripts/build_cot_positioning.py
      - name: Commit if updated
        run: |
          if git diff --quiet -- public/cot_positioning.json public/data_manifest.json; then
            echo "No changes to commit."
          else
            git config user.name  "Market Dashboard Bot"
            git config user.email "bot@github-actions"
            git add public/cot_positioning.json public/data_manifest.json
            git commit -m "CFTC COT weekly positioning refresh [skip ci]"
            for _i in 1 2 3; do git pull --rebase --autostash origin main && git push && break || sleep 4; done
          fi
