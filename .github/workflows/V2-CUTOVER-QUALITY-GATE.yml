name: V2-CUTOVER-QUALITY-GATE

# Hard pre-merge check on v2 cutover rules — themes #3 / #4 / #5 / #7 / #10
# from Joe's 2026-05-05 punch. Fails the build on any banned-lexicon hit,
# hardcoded number in copy, internal table-name leak, internal jargon, or
# Apple-blue / legacy palette. See LESSONS rule 2026-05-06.
#
# 2026-10-23 (health sweep, hard rule 0.18 rule 2): the "snapshot fixture"
# step was retired. Its four fixtures locked the May-2026 v2 pages
# (MacroOverviewPage, AssetTiltPage, IndicatorsPage, MethodologyBody) that no
# longer exist — the site runs src/overhaul/ — so the step had failed on every
# pull request since at least 2026-10-22 and could never go green. A check
# that tests something retired is retired with it: fixtures/v2_snapshots/ and
# scripts/check_v2_snapshot_fixtures.py are deleted in the same change.

on:
  pull_request:
    paths:
      - "public/*.json"
      - "src/v2/**"
      - "scripts/check_v2_cutover_quality.py"
      - ".github/workflows/V2-CUTOVER-QUALITY-GATE.yml"
  push:
    branches:
      - "feature/ux-overhaul-cutover-2026-05"
      - "feature/ux-**"
      - "feature/v2-**"

jobs:
  cutover-quality-gate:
    name: Enforce 12-theme cutover rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run cutover quality gate
        run: python scripts/check_v2_cutover_quality.py
