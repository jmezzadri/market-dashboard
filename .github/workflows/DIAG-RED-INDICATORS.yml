name: DIAG-RED-INDICATORS
on:
  workflow_dispatch: {}
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Query red indicators
        run: |
          python3 - <<'PY'
          import os, urllib.request, json
          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          req = urllib.request.Request(
            f"{url}/rest/v1/pipeline_health?status=in.(red,unknown)&select=indicator_id,label,status,last_good_at,data_as_of,last_error,last_check_at",
            headers={"apikey": key, "Authorization": f"Bearer {key}", "Accept": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=10) as r:
            rows = json.loads(r.read())
          print(f"=== RED/UNKNOWN in pipeline_health ({len(rows)} rows) ===")
          for row in rows:
            print(f"  {row['indicator_id']:<35} status={row['status']:<7} last_good={str(row.get('last_good_at',''))[:19]} data_as_of={str(row.get('data_as_of',''))[:10]} err={str(row.get('last_error',''))[:60]}")
          # Also show green count
          req2 = urllib.request.Request(
            f"{url}/rest/v1/pipeline_health?status=eq.green&select=indicator_id",
            headers={"apikey": key, "Authorization": f"Bearer {key}", "Accept": "application/json"},
          )
          with urllib.request.urlopen(req2, timeout=10) as r:
            green_rows = json.loads(r.read())
          print(f"Green rows: {len(green_rows)}")
          PY