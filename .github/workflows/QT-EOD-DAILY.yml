name: QT-EOD-DAILY

# Close-of-day snapshot for the Quality Trend paper book. READ-ONLY at the
# broker: it records equity + positions into qt_nav_daily and syncs order fill
# states into qt_orders. It cannot submit, cancel or modify an order — that is
# the whole reason it is allowed to run on a schedule.
#
# 21:10 UTC = 17:10 ET in summer, 16:10 ET in winter — after the close in both.

on:
  schedule:
    - cron: '10 21 * * 1-5'
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Snapshot account + sync fills
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m paper_portfolio.qt.eod
