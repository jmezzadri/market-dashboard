name: PAPER-PORTFOLIO-CANCEL-OPEN
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually cancel (true) or just list (false)'
        required: false
        default: 'false'
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Cancel open paper orders
        env:
          SUPABASE_ACCESS_TOKEN:  ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALPACA_PAPER_KEY_ID:    ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET:    ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_PAPER_BASE_URL:  ${{ secrets.ALPACA_PAPER_BASE_URL }}
        run: |
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            python -m scripts.paper_cancel_open --apply
          else
            python -m scripts.paper_cancel_open
          fi
