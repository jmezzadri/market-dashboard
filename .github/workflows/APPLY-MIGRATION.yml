name: APPLY-MIGRATION

# One-shot, dispatch-only: apply a single SQL file from supabase/migrations/
# to the live database through the Supabase Management API (DDL-capable —
# PostgREST cannot run DDL, so seeding-style workflows don't cover ALTERs).
# Pattern follows SEED-DATA-ADDS; auth follows the universe helper in
# trading-scanner (Management API + SUPABASE_ACCESS_TOKEN).
on:
  workflow_dispatch:
    inputs:
      filename:
        description: "Bare migration filename inside supabase/migrations/"
        required: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply the migration through the Management API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MIGRATION_FILENAME: ${{ inputs.filename }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, pathlib, sys
          fn = os.environ["MIGRATION_FILENAME"]
          path = pathlib.Path("supabase/migrations") / fn
          if not path.is_file():
              sys.exit(f"No such migration: {path}")
          sql = path.read_text()
          ref = os.environ["SUPABASE_URL"].replace("https://", "").split(".")[0]
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{ref}/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={"Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                       "Content-Type": "application/json",
                       # The API gateway 403s python-urllib's default agent;
                       # same browser UA the breadth workflows send.
                       "User-Agent": ("Mozilla/5.0 (X11; Linux x86_64) "
                                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                                      "Chrome/124.0 Safari/537.36")})
          with urllib.request.urlopen(req, timeout=120) as r:
              print("HTTP", r.status)
              print((r.read().decode() or "(empty result — DDL applied)")[:1000])
          PY
