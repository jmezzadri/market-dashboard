name: BRIEF-FRESHNESS-SELFHEAL

# Safety net for the homepage daily brief (Data Steward, 2026-06-29).
# The 06:15 ET DAILY-BRIEF-WRITER is the normal path. This guard runs after it
# and checks the brief actually published on the live site. If that brief is not
# dated today, it regenerates it and emails Joe. This catches the case a
# run-and-fail alert cannot: a producer that is DISABLED or SKIPPED never runs,
# so it never "fails" — but the homepage still freezes. Checking the live
# outcome catches every cause. (Froze the homepage on 2026-06-29; never again.)
#
# Pipeline name (Data Steward convention): commentary-daily-brief-selfheal
# Required secrets: ANTHROPIC_API_KEY, SMTP_USER, SMTP_PASSWORD, EMAIL_TO,
#   EMAIL_FROM (optional), SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, MACROTILT_BOT_PAT

on:
  schedule:
    # Dense morning sweep so the homepage CANNOT stay stale past mid-morning even if the
    # 06:15 writer cron lags or drops (GitHub's scheduler is best-effort). Every 30 min,
    # 10:00-15:30 UTC = ~06:00-11:30 ET (EDT) / 05:00-10:30 ET (EST) — spans the writer in
    # both DST seasons. Idempotent: it only regenerates when the LIVE site is not today's,
    # so the extra runs are cheap no-ops. Cloud-only; nothing depends on a laptop.
    - cron: '*/30 10-15 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  selfheal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MACROTILT_BOT_PAT }}   # admin PAT bypasses required checks

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check live brief is current; regenerate + alert if stale
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRIEF_SEND_MODE: live
          BRIEF_FORCE_REBUILD: "1"   # when healing, regenerate even if the local file looks current (deploy lag)
        run: python scripts/brief_selfheal.py

      - name: Commit brief if the self-heal regenerated it
        run: |
          git config user.name "macrotilt-bot"
          git config user.email "macrotilt-bot@users.noreply.github.com"
          git add public/daily_brief.json
          if [[ -n "$(git diff --cached --name-only)" ]]; then
            git commit -m "Daily brief — self-heal regenerate $(date -u +%Y-%m-%d) [skip ci]"
            # 2026-08-18: a bare `git push` loses the data-commit race. This repo commits
            # several times an hour, so another workflow WILL land between our checkout
            # and our push -- macrotilt-engine-daily died exactly that way on 8/17 (run
            # 32063212545, step "Commit ... if changed") and emailed Joe about it. Rebase
            # onto whatever landed and retry; only a persistent failure is a real error.
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "push race on attempt $attempt — retrying in 5s"
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::could not push after 5 attempts — this is a real failure, not a race"
              exit 1
            fi
          else
            echo "Brief already current — no self-heal needed"
          fi
