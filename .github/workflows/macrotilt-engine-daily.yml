name: macrotilt-engine-daily

# Daily compute of the MacroTilt 2-axis regime engine.
# Reads public/indicator_history.json (spliced MOVE 2002-11-12+) and pulls
# DGS10 from FRED. Writes public/macrotilt_engine.json — consumed by Macro
# Overview page, Asset Tilt page, and the home page tile.
#
# Schedule:
#   - Daily 19:45 UTC weekdays (≈ 15:45 ET standard / 14:45 ET DST)
#     so the snapshot is current before market close. The weekly Friday read
#     drives Monday-open execution per the engine spec.

on:
  schedule:
    - cron: "45 19 * * 1-5"
  workflow_dispatch:

concurrency:
  group: macrotilt-engine-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Bot PAT (admin) bypasses main's required status checks, which block
          # the default Actions token from pushing data commits (Joe 2026-06-03).
          token: ${{ secrets.MACROTILT_BOT_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run compute
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/compute_macrotilt_engine.py

      - name: Verify snapshot is contract-compatible
        run: |
          test -s public/macrotilt_engine.json
          python -c "
          import json
          d = json.load(open('public/macrotilt_engine.json'))
          assert d.get('as_of'), 'missing as_of'
          assert d.get('framework') == 'MacroTilt 2-axis engine', f'bad framework: {d.get(\"framework\")}'
          stress = d.get('stress', {})
          assert stress.get('state') in ('Risk On','Watch','Risk Off'), f'bad stress state: {stress.get(\"state\")}'
          assert isinstance(stress.get('move_value'), (int, float))
          assert 0 <= stress.get('move_percentile_5y') <= 1
          yr = d.get('yield_regime', {})
          assert yr.get('state') in ('Inflationary','Neutral','Deflationary'), f'bad yield state: {yr.get(\"state\")}'
          assert 0 <= yr.get('delta_y_3m_percentile_5y') <= 1
          alloc = d.get('allocation', {})
          assert alloc.get('equity_pct') in (50, 80, 100), f'bad equity_pct: {alloc.get(\"equity_pct\")}'
          assert alloc.get('defensive_pct') in (0, 20, 50), f'bad defensive_pct: {alloc.get(\"defensive_pct\")}'
          sl = alloc.get('active_sleeve_composition', {})
          total = sum(sl.values())
          assert abs(total - 1.0) < 1e-6, f'sleeve composition does not sum to 1: {total}'
          print('OK', d['as_of'], stress['state'], yr['state'], f'{alloc[\"equity_pct\"]}% equity')
          "

      - name: Verify live history series advanced
        run: |
          test -s public/macrotilt_engine_history.json
          python -c "
          import json
          h = json.load(open('public/macrotilt_engine_history.json'))
          w = h.get('weekly', [])
          assert len(w) > 500, f'history too short: {len(w)}'
          assert h.get('as_of') == w[-1]['date'], 'as_of must equal last weekly date'
          print('history OK', len(w), 'weeks, latest', h['as_of'])
          "

      - name: Commit snapshot + history if changed
        run: |
          git config user.name "macrotilt-bot"
          git config user.email "macrotilt-bot@users.noreply.github.com"
          git add public/macrotilt_engine.json public/macrotilt_engine_history.json
          if [[ -n "$(git diff --cached --name-only)" ]]; then
            git commit -m "MacroTilt engine daily refresh — $(date -u +%Y-%m-%d) [skip ci]"
            # 2026-08-18: a bare `git push` loses the data-commit race. This repo commits
            # several times an hour, so another workflow WILL land between our checkout
            # and our push -- macrotilt-engine-daily died exactly that way on 8/17 (run
            # 32063212545, step "Commit ... if changed") and emailed Joe about it. Rebase
            # onto whatever landed and retry; only a persistent failure is a real error.
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "push race on attempt $attempt — retrying in 5s"
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::could not push after 5 attempts — this is a real failure, not a race"
              exit 1
            fi
          else
            echo "No change to engine snapshot or history"
          fi
