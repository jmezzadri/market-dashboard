name: PAPER-PORTFOLIO-RESTATE

# One-off (workflow_dispatch only): restate the paper book's HISTORICAL nav +
# positions rows at official session closes from prices_eod. See
# scripts/paper_restate_history.py for the full why. Safe to re-run.

on:
  workflow_dispatch: {}

concurrency:
  group: paper-portfolio-restate
  cancel-in-progress: false

jobs:
  restate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out market-dashboard
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Restate history at official closes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
        run: python -m scripts.paper_restate_history
