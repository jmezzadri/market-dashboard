# MASSIVE-DAILY — daily refresh of Massive-sourced tables.
#
# Bug #YYYY-MM-DD (2026-05-14): previously the primary fired at 22:00 UTC
# (18:00 ET, 2 hours after the bell) and in practice ran 4-8 hours late
# via Backup B because GitHub Actions schedules drift. That left today's
# close out of prices_eod until ~2:30 AM ET the next morning, and the
# ticker-drawer headline rendered yesterday's $8.86 ONDS close next to
# a chart that already had today's $11.21. Primary fire moved up to
# 20:30 UTC (16:30 ET, ~30 min after market close) so today's close
# lands the same day. Older fires retained as backups in case the primary
# is dropped or delayed.
#
# Fire windows (UTC):
#   - 20:30 UTC = 16:30 ET (primary, ~30 min after market close)
#   - 21:00 UTC = 17:00 ET (backup A, ~1 h after close)
#   - 22:00 UTC = 18:00 ET (backup B, ~2 h after close — old primary)
#   - 00:00 UTC = 20:00 ET (backup C, fires next-day Tue-Sat)
#   - 03:00 UTC = 23:00 ET (backup D, fires next-day Tue-Sat)
# Backups are no-ops when an earlier window already wrote the day
# (the script is idempotent — universe + prices + corp actions all
# upsert by natural key, so re-running is safe).
# Also triggerable on demand via workflow_dispatch.
#
# Note on timing: this assumes US market close at 16:00 ET. During
# DST (most of the year, second Sunday in March → first Sunday in
# November) ET = UTC-4, so 16:30 ET = 20:30 UTC. In standard time
# ET = UTC-5, so 16:30 ET = 21:30 UTC. The 20:30 + 21:00 UTC primary
# pair covers DST; the 22:00 UTC backup covers standard time. All
# upserts are idempotent so an early-and-late fire pair is harmless.
#
# Same backfill script as the one-shot MASSIVE-INITIAL-BACKFILL, but
# with shorter dividends/splits lookback windows since most rows
# already exist from the initial backfill — daily run just catches
# new/revised records.
#
# Wall-clock target: ~4 min (universe ~3 min + EOD 5s + small div/split
# deltas).  Well inside the free-tier 5/min throttle.

name: MASSIVE-DAILY

on:
  schedule:
    # Cron is UTC. Same-day evening runs are best-effort scraps — Polygon's
    # T+0 batch right after the close only contains a few dozen tickers
    # (verified 2026-05-27: by 23:00 UTC the same day, only 63 of ~12,200
    # universe was ingested). The CANONICAL "panel is complete" run is the
    # next-morning window: between 02:00 and 08:00 ET the following day
    # Polygon publishes the full T+1 EOD batch and Massive pulls it.
    #
    # Same-day approximate runs (kept so dashboard tiles can show a rough
    # close intra-evening; script is idempotent so safe to re-fire):
    - cron: "30 20 * * 1-5"  # Mon-Fri 16:30 ET (DST primary)
    - cron: "0 21  * * 1-5"  # Mon-Fri 17:00 ET
    - cron: "0 22  * * 1-5"  # Mon-Fri 18:00 ET
    - cron: "0 0   * * 2-6"  # Mon-Fri 20:00 ET (next-day 00:00 UTC)
    - cron: "0 3   * * 2-6"  # Mon-Fri 23:00 ET (next-day 03:00 UTC)
    # Next-morning canonical "panel complete" runs (Joe directive 2026-05-27):
    - cron: "0 12  * * 2-6"  # Tue-Sat 08:00 ET (EDT) — catches Polygon T+1 batch
    - cron: "0 13  * * 2-6"  # Tue-Sat 08:00 ET (EST) — standard-time coverage
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run daily refresh
        env:
          MASSIVE_API_KEY:           ${{ secrets.MASSIVE_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DIVIDENDS_DAYS:            "7"
          SPLITS_DAYS:               "30"
          PYTHONUNBUFFERED:          "1"
        run: |
          python3 scripts/backfill_massive_initial.py
      - name: Retro-adjust split seams (LESSONS 4.20)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPLIT_ADJUST_DAYS:         "10"
          PYTHONUNBUFFERED:          "1"
        run: |
          pip install --quiet requests
          python3 scripts/adjust_splits_retroactive.py

      # 2026-10-23 (health sweep): the Paper page's risk figures are computed by
      # QT-EOD-DAILY at ~23:57 UTC, but the session's closes reach prices_eod
      # only with this job's T+1 morning pass (~08:15 UTC — read from
      # prices_eod.ingested_at, every day since the cockpit shipped). So every
      # evening's qt_risk_daily row measured the PREVIOUS session under a green
      # stamp, and /paper said "computed after the Oct 21 close" beside marks for
      # Oct 22. Re-measure here, once the closes are in: paper_portfolio.qt.risk
      # upserts on (d, account), so as_of then equals d. Guarded by the data
      # (LESSONS 5.7, 5.19): runs only when the newest risk row does not yet
      # measure its own close AND that close is now in prices_eod — so the five
      # evening fires of this workflow do nothing, and the morning one runs once.
      - name: Re-measure the Paper book's risk once the closes are in
        continue-on-error: true
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED:          "1"
        run: |
          NEED=$(python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          base = os.environ['SUPABASE_URL'] + '/rest/v1/'
          hdr = {'apikey': os.environ['SUPABASE_SERVICE_ROLE_KEY'], 'Authorization': 'Bearer ' + os.environ['SUPABASE_SERVICE_ROLE_KEY']}
          def get(q):
              return json.load(urllib.request.urlopen(urllib.request.Request(base + q, headers=hdr), timeout=60))
          rows = get('qt_risk_daily?select=d,as_of&order=d.desc&limit=1')
          if not rows:
              print('no'); raise SystemExit
          d, as_of = rows[0]['d'], rows[0].get('as_of')
          if as_of and as_of >= d:
              print('no'); print(f'risk row {d} already measures its own close ({as_of})', file=__import__("sys").stderr); raise SystemExit
          spy = get('prices_eod?select=trade_date&ticker=eq.SPY&trade_date=eq.' + d + '&limit=1')
          if not spy:
              print('no'); print(f'closes for {d} not in prices_eod yet (risk row as_of {as_of}) — the next pass will catch them', file=__import__("sys").stderr); raise SystemExit
          print('yes'); print(f'risk row {d} measures {as_of}; closes for {d} are in — re-measuring', file=__import__("sys").stderr)
          PY
          )
          if [ "$NEED" != "yes" ]; then exit 0; fi
          pip install --quiet pandas numpy requests
          if python -m paper_portfolio.qt.risk; then
            AS_OF=$(python3 -c "
          import os, json, urllib.request
          req = urllib.request.Request(os.environ['SUPABASE_URL'] + '/rest/v1/qt_risk_daily?select=d&order=d.desc&limit=1',
              headers={'apikey': os.environ['SUPABASE_SERVICE_ROLE_KEY'], 'Authorization': 'Bearer ' + os.environ['SUPABASE_SERVICE_ROLE_KEY']})
          rows = json.load(urllib.request.urlopen(req)); print(rows[0]['d'] if rows else '-')
          ")
            python3 scripts/upsert_pipeline_health.py qt-risk-daily "$AS_OF" green
          else
            python3 scripts/upsert_pipeline_health.py qt-risk-daily - red "paper_portfolio.qt.risk failed on the morning re-measure — the Paper page's risk tiles show the previous close"
          fi
