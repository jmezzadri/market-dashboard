name: WORKFLOW_FAILURE_ALERT

# Emails Joe whenever any scheduled workflow finishes in a failure state.
# 2026-07-06: transport switched Resend -> Gmail SMTP (same SMTP_USER /
# SMTP_PASSWORD secrets the daily-brief pipeline sends with every day).
# Resend returned HTTP 403 on BOTH send attempts ever made (2026-07-06) and
# has no delivery track record here — the alert channel had silently never
# delivered an email. Manual test: dispatch this workflow (sends a TEST alert). Closes the gap that hid bug #1077 for 3 days (the freshness
# watchdog quietly went down Friday night and we noticed Tuesday).
#
# How it works:
#   1. workflow_run trigger listens for completion events on every scheduled
#      workflow we care about (listed under `workflows:` below).
#   2. The `if:` filter only proceeds when conclusion == 'failure'.
#   3. A small inline Python step posts a Gmail SMTP email with the workflow
#      name, run URL, head sha, and head commit message.
#   4. 2026-08-13 — that email now goes through a send-once claim keyed on
#      (workflow name, ET date) in public.workflow_alert_log. Several watched
#      workflows fire many times a morning by design; when their condition is
#      broken they fail many times, and Joe was getting an email for each.
#      One workflow, one email, one day. Fail-open if the ledger is down.
#   5. 2026-08-14 — the watchlist is TIERED. Being on the trigger list above only
#      means the failure is RECORDED (public.workflow_failure_log). Only the
#      workflows in the VISIBLE set in the send step email Joe on a first
#      failure; background data jobs email him only once they have failed across
#      2+ separate days. A backfill that blips and self-heals four hours later is
#      not news for a non-engineer at 5:35am. LESSONS 4.30.
#
# To add a new workflow to the watchlist: append its `name:` value to the
# workflows: list. The trigger is matched on workflow NAME, not file name.

on:
  workflow_run:
    workflows:
      # Daily indicator + composite chain
      - INDICATOR-REFRESH_7AM_WEEKDAYS
      # Intraday scanner triplet
      - TICKER_EVENTS_3X_WEEKDAYS
      # - UNIVERSE_SNAPSHOT_3X_WEEKDAYS   removed 2026-08-14: disabled, Unusual Whales lapsed 8/12
      # - SCAN_330PM_WEEKDAYS             removed 2026-08-18: no such workflow name (see below)
      # Weekly + quarterly research
      # Massive (Polygon) market data — added Phase 3 PR #11a (2026-04-30)
      # closes the gap that left these silent on failure.
      - MASSIVE-DAILY
      - MASSIVE-INITIAL-BACKFILL
      - MASSIVE-TICKER-REFERENCE-BACKFILL
      # Other production data feeds — added Phase 3 PR #11a (2026-04-30)
      # 2026-08-18: EARNINGS_HISTORY_WEEKLY was the FILE name; the trigger matches
      # the workflow's `name:`, which is EARNINGS-HISTORY-WEEKLY (hyphens). The
      # underscore spelling matched nothing and had been inert since 2026-04-30.
      - EARNINGS-HISTORY-WEEKLY
      # 2026-08-18: SPY_SECTOR_WEIGHTS_DAILY, REFRESH-CONGRESS-ROSTER and
      # SCAN_330PM_WEEKDAYS removed — no workflow in this repo carries any of
      # those names. A watchlist entry that matches nothing is a silent no-op,
      # so it reads as coverage while providing none. The congress ingest is
      # live under its real name and is listed below.
      # Phase 4 cleanup PR η (2026-05-02) — close the workflow-alert watchlist
      # gap. Each of these was missing on-failure alerting.
      - DAILY-HOME-SMOKE
      - NEWS-ZH_PREMIUM_COOKIE_HEALTH-WEEKLY
      - MASSIVE-V9-ETF-BACKFILL
      - SCREENER_TRADING_OPPS_DAILY
      - PAPER-PORTFOLIO-EOD-DAILY
      - MARKET-INDICATORS-EOD
      # Homepage brief chain + weekly positioning + the freshness guards
      # themselves — added 2026-08-06 after DAILY-BRIEF-WRITER failed 60+
      # runs across three trading days (homepage sat on the Jul 31 brief)
      # with zero alert emails: none of these were on this watchlist.
      - DAILY-BRIEF-WRITER
      - BRIEF-FRESHNESS-SELFHEAL
      - CFTC-COT-WEEKLY
      - PIPELINE-FRESHNESS-WATCHDOG
      # - PAPER-PORTFOLIO-INTRADAY        removed 2026-08-14: disabled stub, trading halted 8/12
      - macrotilt-engine-daily
      - INDICATOR-DRILLS-DAILY
      # Conviction Events engine (2026-08-11) — the one book replacing the
      # two retired sleeves. KILL-CHECK deliberately FAILS on a fresh
      # kill-switch trip so this watchlist emails the trip.
      # - CONVICTION-OPEN-DAILY           removed 2026-08-14: disabled stub, trading halted 8/12
      # - CONVICTION-KILL-CHECK           removed 2026-08-14: disabled stub, trading halted 8/12
      #
      # 2026-08-18 sweep — the other 24 scheduled workflows, none of which was on
      # this list. MONITOR-RECONCILE is what exposed the gap: it failed FOUR
      # consecutive runs across 19 hours (8/17 18:26 → 8/18 12:27) and produced
      # no workflow_failure_log row and no escalation, because a workflow that
      # is not on this trigger is not merely un-emailed — it is unrecorded. That
      # is the #1077 failure mode this workflow was built to end, still open for
      # more than half the schedule.
      #
      # Being here only RECORDS a failure. Emailing Joe still requires a place in
      # VISIBLE below, and none of these get one — a data job that blips and
      # self-heals is not news at 5:35am. Their route to his inbox is the
      # 2+-separate-days stuck rule, which is exactly what it is for.
      - MONITOR-RECONCILE
      - FRESHNESS-ALARM
      - ANALYST_INGEST_DAILY
      - BREADTH-DAILY
      - CONGRESS_INGEST_DAILY
      - DIVERGENCE_SCAN_DAILY
      - ECON-CALENDAR-DAILY
      - INSIDER_INGEST_NIGHTLY
      - LSE-ARCHIVE-IV
      - POSITIONING-TFF-WEEKLY
      - POWER-TREND-LIST-MONTHLY
      - REFRESH-ISM-MONTHLY
      - SCAN-INVARIANTS-DAILY
      - SHORT_INTEREST_INGEST_DAILY
      - TRADE-IDEA-SCORECARD-DAILY
      - TRADING-OPPS-BACKTEST
      - V5_SCAN_DAILY
      - V5_SCAN_SAFETY_NET
      - scanner-insider_edgar-daily
      - Data reconciler — flag duplicate / orphan / mis-wired series
      - Detector — dead UI files (weekly)
    types:
      - completed
  workflow_dispatch: {}   # manual TEST send — proves the channel end-to-end

jobs:
  alert:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repo (for the failure classifier)
        if: github.event_name == 'workflow_run'
        # continue-on-error: this alert is the last line of defence against a
        # silent red. A checkout hiccup must degrade to "alert anyway" (handled
        # below), never to "no email" — that is exactly the failure mode this
        # workflow exists to prevent (0.1: fake green is forbidden).
        continue-on-error: true
        uses: actions/checkout@v4.2.2

      - name: Was this a real failure or GitHub infra noise?
        if: github.event_name == 'workflow_run'
        # 2026-05-06 (Joe directive — "why is my data refreshing always failing,
        # I get dozens of these emails"). GitHub Actions runner shortages cause
        # workflows to finish in a failed state even when no code failed.
        #
        # 2026-08-06 — that rule only caught ONE of the two shapes. Shape (a):
        # the job never gets a runner, GitHub cancels everything (conclusion=
        # cancelled) — already suppressed. Shape (b): a runner IS assigned but
        # "Set up job" hangs and GitHub marks THAT STEP failed, ending the job
        # with conclusion=failure. Shape (b) is indistinguishable from a real
        # failure at the JOB level, so `any(job.conclusion=='failure')` alerted
        # on it. Three such emails fired for PAPER-PORTFOLIO-EOD-DAILY on
        # 2026-08-06 (runs 31114532783, 31116873789 — each with exactly one
        # step, "Set up job" = failure, and no checkout).
        #
        # The discriminator is WHICH STEP failed: if the only failed steps are
        # GitHub's own scaffolding ("Set up job" / "Set up runner" /
        # "Complete job"), the runner never came up and our code never ran.
        # A genuine failure always fails a step the workflow author wrote.
        # Classification logic lives in .github/scripts/classify_run_failure.py
        # so it is unit-testable (tests/test_classify_run_failure.py).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
          WF_NAME:   ${{ github.event.workflow_run.name }}
        run: |
          set -uo pipefail
          CLASSIFIER=.github/scripts/classify_run_failure.py

          # Every path that stops us from CLASSIFYING must still ALERT.
          if [ ! -f "$CLASSIFIER" ]; then
            echo "::warning::Classifier not found (checkout failed?) — alerting unclassified."
            echo "IS_REAL_FAILURE=true" >> "$GITHUB_ENV"
            exit 0
          fi

          JOBS_JSON=$(curl -fsS --max-time 15 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${WF_RUN_ID}/jobs?per_page=100") || {
            echo "::warning::Could not fetch job list — alerting unclassified."
            echo "IS_REAL_FAILURE=true" >> "$GITHUB_ENV"
            exit 0
          }

          VERDICT=$(printf '%s' "$JOBS_JSON" | python3 "$CLASSIFIER") || {
            echo "::warning::Classifier errored — alerting unclassified."
            echo "IS_REAL_FAILURE=true" >> "$GITHUB_ENV"
            exit 0
          }
          echo "Workflow: $WF_NAME  ·  run: $WF_RUN_ID  ·  verdict: $VERDICT"

          case "$VERDICT" in
            real)
              echo "::notice::Real failure (an author-written step failed) — alert will be sent."
              echo "IS_REAL_FAILURE=true" >> "$GITHUB_ENV"
              ;;
            infra_cancelled)
              echo "::notice::All jobs cancelled — GitHub runner shortage. Suppressing alert."
              echo "IS_REAL_FAILURE=false" >> "$GITHUB_ENV"
              ;;
            infra_setup)
              echo "::notice::Failure confined to GitHub's own setup/teardown steps (runner never provisioned; our code never ran). Suppressing alert."
              echo "IS_REAL_FAILURE=false" >> "$GITHUB_ENV"
              ;;
            *)
              # Mixed / unrecognised shape — err toward visibility.
              echo "::notice::Ambiguous outcome — alerting to be safe."
              echo "IS_REAL_FAILURE=true" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Send alert email (Gmail SMTP — same channel as the daily brief)
        if: env.IS_REAL_FAILURE == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Send-once ledger (LESSONS 4.12 / 4.28) — see claim_todays_alert below.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IS_TEST: ${{ github.event_name == 'workflow_dispatch' }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
          WF_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WF_HEAD_MSG: ${{ github.event.workflow_run.head_commit.message }}
          WF_CREATED: ${{ github.event.workflow_run.created_at }}
          # 2026-08-25: needed to read WHICH STEP failed and WHAT IT PRINTED, so the
          # email can say the actual problem instead of "open the run log".
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, datetime, urllib.request, urllib.error, urllib.parse
          from zoneinfo import ZoneInfo

          ET = ZoneInfo("America/New_York")

          # --- WHO the email is FOR (2026-08-14) --------------------------------
          # Joe: "for the fucking love of God make these emails stop". The trigger was
          # MASSIVE-TICKER-REFERENCE-BACKFILL — a job that runs every ~4 hours, had been
          # green on every run for days, blipped ONCE at 09:34Z, and emailed him at
          # 5:35am. He is a management consultant, not an on-call engineer. "A background
          # data backfill failed once and retries in four hours" is not something he can
          # act on, and it is not worth his attention at any hour.
          #
          # So the watchlist is now TIERED by whether Joe can SEE the damage:
          #   VISIBLE  — his brief, the live site, the paper book (his money). One email
          #              on the first failure of the day, as before.
          #   BACKGROUND — data plumbing. Never emailed for a blip. Recorded every time,
          #              and escalated to ONE email only once it is genuinely STUCK:
          #              failures on 2+ SEPARATE days. A job that fails and self-heals on
          #              its next run was never news.
          # Adding a workflow to the `workflows:` trigger list above does NOT make it
          # email Joe — it has to earn a place in VISIBLE below.
          # 2026-08-25: QT-EOD-DAILY was on the trigger list but not here, so its
          # failures were only RECORDED, never emailed on the first failure. It is
          # now the paper book's accounting job — and it deliberately FAILS when the
          # nightly custody check finds a holding that changed with no trade behind
          # it, so being VISIBLE is the whole point. (A 243-share EBAY position
          # vanished from the account overnight on 8/25 with no sell and no cash;
          # nothing noticed for six trading days.) The three retired entries below
          # are kept commented, not deleted, so nobody re-adds them by accident —
          # per this file's own rule, a watchlist entry matching nothing reads as
          # coverage while providing none.
          VISIBLE = {
              "DAILY-BRIEF-WRITER",          # his morning email + the homepage brief
              "BRIEF-FRESHNESS-SELFHEAL",    # the homepage brief going stale
              "DAILY-HOME-SMOKE",            # the site itself being up
              # "QT-EOD-DAILY",             retired 2026-08-28 with the Quality Trend book
              # "QT-REBALANCE",              retired 2026-08-28 with the Quality Trend book
              # "QT-FUNDAMENTALS-REFRESH",   retired 2026-08-28 with the Quality Trend book
              # "CONVICTION-OPEN-DAILY",     retired 2026-08-13 with the Conviction Events book
              # "CONVICTION-KILL-CHECK",     retired 2026-08-13 with the Conviction Events book
              # "PAPER-PORTFOLIO-EOD-DAILY", retired 2026-08-13 — superseded by QT-EOD-DAILY
              # "PAPER-PORTFOLIO-INTRADAY",  retired 2026-08-13, disabled stub
              "macrotilt-engine-daily",
          }
          STUCK_LOOKBACK_DAYS = 3   # window for the "2+ separate days" escalation test


          def _rest(method, path, body=None):
              base = (os.environ.get("SUPABASE_URL") or "").rstrip("/")
              key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY") or ""
              if not (base and key):
                  raise RuntimeError("ledger not configured")
              req = urllib.request.Request(
                  base + "/rest/v1/" + path,
                  data=json.dumps(body).encode() if body is not None else None,
                  method=method,
                  headers={"apikey": key, "Authorization": "Bearer " + key,
                           "Content-Type": "application/json",
                           "Prefer": "return=minimal" if body is not None else "count=none"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return r.status, r.read().decode()


          def record_failure(workflow, run_id, tier, emailed):
              """Every failure lands here whether or not Joe is told. This is the record
              I read; his inbox is not a log file."""
              try:
                  _rest("POST", "workflow_failure_log", {
                      "workflow_name": workflow,
                      "run_id": int(run_id) if str(run_id).isdigit() else None,
                      "fail_date": datetime.datetime.now(ET).strftime("%Y-%m-%d"),
                      "tier": tier, "emailed": emailed})
              except Exception as e:
                  print(f"record: could not log this failure ({e})")


          def is_stuck(workflow):
              """True when a BACKGROUND job also failed on an EARLIER day inside the
              lookback -- today plus that day means 2+ separate days, i.e. it did not
              self-heal and is genuinely stuck. Counting prior days only (not today) lets
              this run before today's row is written, so one INSERT stays accurate.

              Fails CLOSED: if the ledger is unreachable we stay quiet rather than mail
              Joe about plumbing. The run is still red in the Actions tab, which is where
              this class of problem belongs."""
              try:
                  today = datetime.datetime.now(ET).date()
                  since = (today - datetime.timedelta(days=STUCK_LOOKBACK_DAYS)).isoformat()
                  q = (f"workflow_failure_log?select=fail_date"
                       f"&workflow_name=eq.{urllib.parse.quote(workflow)}"
                       f"&fail_date=gte.{since}&fail_date=lt.{today.isoformat()}")
                  _s, body = _rest("GET", q)
                  days = sorted({row["fail_date"] for row in json.loads(body)})
                  print(f"stuck-check: {workflow} also failed on {len(days)} earlier "
                        f"day(s) since {since} -> {days}")
                  return len(days) >= 1
              except Exception as e:
                  print(f"stuck-check: {e} — staying quiet (background tier)")
                  return False


          def claim_todays_alert(workflow, run_id):
              """One alert email per workflow per ET day (LESSONS 4.12, applied to
              the alerter itself on 2026-08-13).

              The failure that prompted this: BRIEF-FRESHNESS-SELFHEAL runs every
              30 minutes from 06:00-11:30 ET as deliberate redundancy against
              GitHub's best-effort scheduler. When the condition it watches is
              genuinely broken, EVERY one of those runs fails — and each one sent
              its own "Workflow FAILED" email. Redundant timers exist for
              reliability; they must never multiply notifications. Joe got a week
              of that and, fairly, stopped reading them.

              Atomic by primary key (workflow_name, ET date), not by
              read-then-write: two runs can overlap, and check-then-act is not a
              mutex (LESSONS 4.22d). The first INSERT wins; the rest get 409.

              FAIL-OPEN by design. If the ledger is unreachable we send anyway —
              a duplicate email is an annoyance, a swallowed alert is how bug
              #1077 hid for three days.
              """
              base = (os.environ.get("SUPABASE_URL") or "").rstrip("/")
              key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY") or ""
              if not (base and key):
                  print("claim: ledger not configured — sending unclaimed (fail-open)")
                  return True
              day = datetime.datetime.now(ZoneInfo("America/New_York")).strftime("%Y-%m-%d")
              payload = {"workflow_name": workflow, "alert_date": day,
                         "run_id": int(run_id) if str(run_id).isdigit() else None}
              req = urllib.request.Request(
                  base + "/rest/v1/workflow_alert_log",
                  data=json.dumps(payload).encode(), method="POST",
                  headers={"apikey": key, "Authorization": "Bearer " + key,
                           "Content-Type": "application/json", "Prefer": "return=minimal"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      print(f"claim: won {workflow} for {day} (HTTP {r.status}) — sending")
                      return True
              except urllib.error.HTTPError as e:
                  if e.code == 409:
                      print(f"claim: {workflow} already alerted on {day} — "
                            f"suppressing duplicate (run {run_id}). Fix the workflow, "
                            f"not the alert.")
                      return False
                  print(f"claim: HTTP {e.code} — sending unclaimed (fail-open)")
                  return True
              except Exception as e:
                  print(f"claim: {e} — sending unclaimed (fail-open)")
                  return True


          name      = os.environ["WF_NAME"]
          run_url   = os.environ["WF_RUN_URL"]
          run_id    = os.environ["WF_RUN_ID"]
          head_sha  = os.environ["WF_HEAD_SHA"][:8]
          head_msg  = os.environ.get("WF_HEAD_MSG", "")[:200]
          created   = os.environ.get("WF_CREATED", "")
          stuck = False
          if os.environ.get("IS_TEST") == "true":
              # A manual dispatch is a channel test — it must ALWAYS deliver, so it
              # never touches the ledger (and never burns a real workflow's claim).
              name, run_url, run_id = "TEST — alert channel verification", "https://github.com/jmezzadri/market-dashboard/actions", "manual"
              head_sha, head_msg, created = "-", "Manual dispatch to prove the failure-alert channel delivers.", "-"
          else:
              tier = "visible" if name in VISIBLE else "background"
              stuck = (tier == "background") and is_stuck(name)
              will_email = (tier == "visible") or stuck
              if will_email:
                  will_email = claim_todays_alert(name, run_id)
              record_failure(name, run_id, tier, will_email)
              if not will_email:
                  print(f"{name}: tier={tier}, stuck={stuck} — recorded, NOT emailed. "
                        f"Background plumbing that self-heals is not news for Joe.")
                  raise SystemExit(0)

          # --- PLAIN ENGLISH (2026-08-25) --------------------------------------
          # Joe: "Can you make sure these failure emails are clean what they are?
          # What I should do, they're so annoying. I have no idea what they're for."
          # He is right. The old email said "A scheduled GitHub Actions workflow
          # finished with conclusion failure. Open the run log to see which step blew
          # up." — a job name, a SHA, and a link to a log he will never open. It named
          # the machine, not the thing, and never said whether he had to do anything.
          #
          # Every email now answers three questions in his language: what this is,
          # what went wrong (the actual message the job printed), and what HE should
          # do — which is almost always "nothing, Claude handles it", because he is a
          # management consultant and the standing rule is that the agent does all
          # technical work. Anything not on this list gets the honest default.
          PLAIN = {
              # The three QT-* entries were removed on 2026-08-28 with the Quality
              # Trend book itself. Their workflows no longer exist, so no event can
              # ever name them again.
              "DAILY-BRIEF-WRITER": (
                  "Your morning market brief",
                  "Writes the brief that lands in your inbox and heads the MacroTilt homepage.",
                  "Nothing. If no brief arrives by mid-morning, tell Claude."),
              "BRIEF-FRESHNESS-SELFHEAL": (
                  "The guard that stops the homepage brief going stale",
                  "Watches for the homepage showing an out-of-date brief and republishes it.",
                  "Nothing, unless the homepage is visibly showing an old date."),
              "DAILY-HOME-SMOKE": (
                  "The site health check",
                  "Loads MacroTilt every day and confirms the pages actually render.",
                  "Have a quick look at macrotilt.com. If it looks broken, tell Claude."),
              "macrotilt-engine-daily": (
                  "The daily engine calculation",
                  "Recomputes the macro engine readings the site publishes each day.",
                  "Nothing. Claude will pick it up."),
          }
          DEFAULT_PLAIN = (
              None,
              "A background data job that keeps the site's numbers up to date.",
              "Nothing. Background jobs are only emailed once they stay broken for "
              "more than a day, so this one has not fixed itself — Claude will look.")


          def failure_detail(run_id):
              """Which step failed, and what it actually printed. Best effort: this
              email must still send if GitHub's API is slow or the log has rolled."""
              step, lines = None, []
              tok = os.environ.get("GH_TOKEN") or ""
              repo = os.environ.get("GH_REPO") or "jmezzadri/market-dashboard"
              if not tok or not str(run_id).isdigit():
                  return step, lines
              hdr = {"Authorization": "Bearer " + tok,
                     "Accept": "application/vnd.github+json",
                     "User-Agent": "macrotilt-watchdog"}
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs",
                      headers=hdr)
                  with urllib.request.urlopen(req, timeout=25) as r:
                      jobs = json.load(r).get("jobs", [])
                  bad = next((j for j in jobs if j.get("conclusion") == "failure"), None)
                  if not bad:
                      return step, lines
                  step = next((st.get("name") for st in bad.get("steps", [])
                               if st.get("conclusion") == "failure"), None)
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/actions/jobs/{bad['id']}/logs",
                      headers=hdr)
                  with urllib.request.urlopen(req, timeout=25) as r:
                      raw = r.read().decode("utf-8", "replace")
                  # A job hands this email the exact sentence it wants Joe to read
                  # by printing it behind PLAIN_MARK. NOTHING ELSE from the log is
                  # ever shown. Scraping a tail was tried and rejected: stdout and
                  # stderr interleave on the runner, so a Python traceback lands in
                  # the middle of the message and the "last N lines" are runner
                  # teardown noise — 'File "<frozen runpy>", line 198', git config
                  # chatter, Node deprecation warnings. Joe asked for these emails to
                  # be clean; a job that has not opted in gets a named failing step
                  # and no excerpt, which is honest rather than noisy.
                  MARK = "::macrotilt-plain::"
                  for ln in raw.splitlines():
                      if MARK in ln:
                          lines.append(ln.split(MARK, 1)[1].strip())
              except Exception as e:
                  print(f"failure_detail: {e} — sending without the log excerpt")
              return step, lines


          import html as _html
          label, what_it_is, what_to_do = PLAIN.get(name, DEFAULT_PLAIN)
          if label is None:
              label = name
          failed_step, log_lines = failure_detail(run_id)
          if os.environ.get("IS_TEST") == "true":
              label = "Alert channel test"
              what_it_is = ("A deliberate test send, to prove these emails still reach you. "
                            "Nothing is broken.")
              what_to_do = "Nothing at all. This is the channel working."

          subject = (f"[MacroTilt] Still failing: {label}" if stuck
                     else f"[MacroTilt] {label} — something went wrong")
          if os.environ.get("IS_TEST") == "true":
              subject = "[MacroTilt] Alert channel test — nothing is broken"

          if log_lines:
              said = ("<p style='margin:16px 0 6px;font-weight:600'>What the check said</p>"
                      "<pre style='background:#f6f6f4;border:1px solid #e5e5e0;border-radius:6px;"
                      "padding:10px 12px;font-size:12px;line-height:1.5;white-space:pre-wrap;"
                      "word-break:break-word;margin:0'>"
                      + _html.escape("\n".join(log_lines)) + "</pre>")
          elif failed_step:
              said = (f"<p style='margin:16px 0 6px;font-weight:600'>What went wrong</p>"
                      f"<p style='margin:0'>The step named &ldquo;{_html.escape(failed_step)}&rdquo; "
                      f"failed. The detail is in the run log.</p>")
          else:
              said = ("<p style='margin:16px 0 6px;font-weight:600'>What went wrong</p>"
                      "<p style='margin:0'>The job stopped before finishing. The detail is "
                      "in the run log.</p>")
          repeat_note = ("<p style='margin:0 0 4px;color:#9b2226;font-weight:600'>This has now "
                         "gone wrong on more than one day &mdash; it is not fixing itself.</p>"
                         if stuck else "")
          html = f"""
          <div style='font-family:-apple-system,Segoe UI,sans-serif;color:#111;line-height:1.5;max-width:620px'>
            <h2 style='margin:0 0 10px;font-size:19px'>{label}</h2>
            {repeat_note}
            <p style='margin:0 0 6px;font-weight:600'>What this is</p>
            <p style='margin:0'>{what_it_is}</p>
            {said}
            <p style='margin:18px 0 6px;font-weight:600'>What you should do</p>
            <p style='margin:0;padding:10px 12px;background:#eef4ff;border-left:3px solid #2d5bd7;border-radius:4px'>{what_to_do}</p>
            <p style='margin:22px 0 0;font-size:12px;color:#999;border-top:1px solid #eee;padding-top:10px'>
              Technical detail, if Claude asks for it &mdash;
              job <code>{name}</code>, run <a href='{run_url}' style='color:#999'>{run_id}</a>,
              started {created}, code version <code>{head_sha}</code>.<br>
              You get this because it affects something you can see. Background jobs stay
              silent unless they stay broken more than a day. One email per job per day.
            </p>
          </div>
          """

          import smtplib
          from email.mime.text import MIMEText

          user = os.environ["SMTP_USER"]
          pwd  = os.environ["SMTP_PASSWORD"]
          to   = [a.strip() for a in (os.environ.get("EMAIL_TO") or "josephmezzadri@gmail.com").split(",") if a.strip()]

          msg = MIMEText(html, "html")
          msg["Subject"] = subject
          msg["From"]    = f"MacroTilt Watchdog <{user}>"
          msg["To"]      = ", ".join(to)
          try:
              with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=20) as s:
                  s.login(user, pwd)
                  s.sendmail(user, to, msg.as_string())
              print("SMTP send OK ->", to)
          except Exception as e:
              print("SMTP send FAILED:", e)
              raise SystemExit(1)
          PY
