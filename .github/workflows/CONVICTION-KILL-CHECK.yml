name: CONVICTION-KILL-CHECK

# Conviction Events — post-close bookkeeping + pre-registered kill switch.
#
# Steps:
#   1. Close snapshot (paper_portfolio.runner --phase close — the UNTOUCHED
#      mirror accounting from commit 87906a84): fills mirror, positions +
#      NAV at official session closes. This workflow took over the close
#      bookkeeping when PAPER-PORTFOLIO-CLOSE-DAILY was deleted with the
#      retired two-sleeve engine.
#   2. Post-close phase (paper_portfolio.conviction --phase kill-check), two
#      independent jobs in one step:
#      a. CATASTROPHE STOP (the only risk exit): every held position is
#         screened against today's official close. A close 15% or more below
#         the entry price moves that event's exit_due_date to the next
#         trading session, so tomorrow's open phase sells it market-on-open
#         down the SAME path as a scheduled 21st-day exit. A position already
#         due at that open is left alone (never a double exit). A failed
#         screen fails this job — unscreened positions must never be silent.
#      b. KILL-SWITCH MONITOR: from paper_nav_daily since the NEW inception,
#         compute the book's return vs SPY and the max drawdown from the
#         book's peak. Trip when (>= 40 trading days AND book trails SPY by
#         >= 10 pts) OR (drawdown >= 15%). A trip is recorded in
#         ce_kill_switch and THIS JOB FAILS with a ::error:: annotation so
#         WORKFLOW_FAILURE_ALERT emails. It is a MONITOR: trading continues
#         unaffected — entries are NEVER refused (2026-08-11, Joe). The
#         tripped state latches until a human resets the row.
#
# Schedule (cron is UTC; both DST siblings fire — the close snapshot is an
# idempotent upsert and self-skips when there is no settled session bar):
#   * 21:15 UTC = 5:15 PM EDT (4:15 PM EST) — post-close per the spec.
#   * 22:15 UTC = 5:15 PM EST sibling (harmless re-run of the same closes).

on:
  schedule:
    - cron: '15 21 * * 1-5'
    - cron: '15 22 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (compute, no DB writes)'
        required: false
        default: 'false'

concurrency:
  group: conviction-kill-check
  cancel-in-progress: false

jobs:
  kill-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out market-dashboard
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests pandas pyarrow numpy scipy

      - name: Close snapshot (official-close positions + NAV — untouched accounting)
        env:
          SUPABASE_ACCESS_TOKEN:        ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          ALPACA_PAPER_KEY_ID:          ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET:          ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_PAPER_BASE_URL:        ${{ secrets.ALPACA_PAPER_BASE_URL }}
          PAPER_LIVE_TRADING_ENABLED:   "true"   # LIVE — Conviction Events cutover 2026-08-11 (Joe go)
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m paper_portfolio.runner --phase close --dry-run
          else
            python -m paper_portfolio.runner --phase close
          fi

      - name: Catastrophe stops at today's close + kill-switch monitor
        env:
          SUPABASE_ACCESS_TOKEN:        ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          ALPACA_PAPER_KEY_ID:          ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET:          ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_PAPER_BASE_URL:        ${{ secrets.ALPACA_PAPER_BASE_URL }}
          PAPER_LIVE_TRADING_ENABLED:   "true"   # LIVE — Conviction Events cutover 2026-08-11 (Joe go)
          SMTP_USER:                    ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:                ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO:                     ${{ secrets.EMAIL_TO }}
          EMAIL_FROM:                   ${{ secrets.EMAIL_FROM }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m paper_portfolio.conviction --phase kill-check --dry-run
          else
            python -m paper_portfolio.conviction --phase kill-check
          fi
