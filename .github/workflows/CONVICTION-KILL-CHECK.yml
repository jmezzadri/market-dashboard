name: CONVICTION-KILL-CHECK

# Conviction Events — post-close bookkeeping + pre-registered kill switch.
#
# Steps:
#   1. Close snapshot (paper_portfolio.runner --phase close — the UNTOUCHED
#      mirror accounting from commit 87906a84): fills mirror, positions +
#      NAV at official session closes. This workflow took over the close
#      bookkeeping when PAPER-PORTFOLIO-CLOSE-DAILY was deleted with the
#      retired two-sleeve engine.
#   2. Kill check (paper_portfolio.conviction --phase kill-check): from
#      paper_nav_daily since the NEW inception, compute the book's return vs
#      SPY and the max drawdown from the book's peak. Trip when
#      (>= 40 trading days AND book trails SPY by >= 10 pts) OR
#      (drawdown >= 15%). A trip is recorded in ce_kill_switch, the submitter
#      then refuses all new entries (exits still execute), and THIS JOB FAILS
#      with a ::error:: annotation so WORKFLOW_FAILURE_ALERT emails. The
#      tripped state latches until a human resets the row.
#
# Schedule (cron is UTC; both DST siblings fire — the close snapshot is an
# idempotent upsert and self-skips when there is no settled session bar):
#   * 21:15 UTC = 5:15 PM EDT (4:15 PM EST) — post-close per the spec.
#   * 22:15 UTC = 5:15 PM EST sibling (harmless re-run of the same closes).

on:
  schedule:
    - cron: '15 21 * * 1-5'
    - cron: '15 22 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (compute, no DB writes)'
        required: false
        default: 'false'

concurrency:
  group: conviction-kill-check
  cancel-in-progress: false

jobs:
  kill-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out market-dashboard
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests pandas pyarrow numpy scipy

      - name: Close snapshot (official-close positions + NAV — untouched accounting)
        env:
          SUPABASE_ACCESS_TOKEN:        ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          ALPACA_PAPER_KEY_ID:          ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET:          ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_PAPER_BASE_URL:        ${{ secrets.ALPACA_PAPER_BASE_URL }}
          PAPER_LIVE_TRADING_ENABLED:   "false"   # FROZEN 2026-08-10 (Joe: full strategy reset) — flip to "true" only at the Conviction Events cutover, AFTER migration 094 + scripts/ce_reset_epoch.py --execute
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m paper_portfolio.runner --phase close --dry-run
          else
            python -m paper_portfolio.runner --phase close
          fi

      - name: Kill-switch check (book vs SPY since inception + max drawdown)
        env:
          SUPABASE_ACCESS_TOKEN:        ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          ALPACA_PAPER_KEY_ID:          ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET:          ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_PAPER_BASE_URL:        ${{ secrets.ALPACA_PAPER_BASE_URL }}
          PAPER_LIVE_TRADING_ENABLED:   "false"   # FROZEN — same flip as above; a fresh trip exits nonzero so WORKFLOW_FAILURE_ALERT emails
          SMTP_USER:                    ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:                ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO:                     ${{ secrets.EMAIL_TO }}
          EMAIL_FROM:                   ${{ secrets.EMAIL_FROM }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m paper_portfolio.conviction --phase kill-check --dry-run
          else
            python -m paper_portfolio.conviction --phase kill-check
          fi
