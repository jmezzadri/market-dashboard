name: BREADTH-REBUILD
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: branch to write public/indicator_history.json adv_dec into
        required: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.MACROTILT_BOT_PAT }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy
      - name: deploy A/D line fn, compute, splice indicator_history.json, seed health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,re,urllib.request
          import pandas as pd
          U=os.environ['SUPABASE_URL']; TOK=os.environ['SUPABASE_ACCESS_TOKEN']
          ref=re.sub(r'^https?://','',U).split('.')[0]
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def mgmt(sql,timeout=240):
              req=urllib.request.Request(f"https://api.supabase.com/v1/projects/{ref}/database/query",
                data=json.dumps({"query":sql}).encode(),method="POST",
                headers={"Authorization":"Bearer "+TOK,"Content-Type":"application/json","User-Agent":UA})
              with urllib.request.urlopen(req,timeout=timeout) as r: return json.loads(r.read().decode())
          # deploy the A/D line function from the migration file
          mgmt(open('supabase/migrations/063_ad_line_rpc.sql').read())
          rows=mgmt("set statement_timeout='200s'; select trade_date, ad_line from public.compute_ad_line() order by trade_date")
          pts=[[r['trade_date'], int(r['ad_line'])] for r in rows if r.get('ad_line') is not None]
          print("A/D line points:",len(pts),"latest:",pts[-1] if pts else None)
          def compute_stats(points, direction="lw", window_years=3):
              dates=[pd.Timestamp(p[0]) for p in points]; vals=[p[1] for p in points]
              s=pd.Series(vals,index=dates).sort_index()
              s=s[s.index>=s.index.max()-pd.Timedelta(days=365*window_years)]
              if len(s)>20: s=s.clip(lower=s.quantile(0.01),upper=s.quantile(0.99))
              return {"mean":round(float(s.mean()),4),"sd":round(float(s.std()),4),
                      "window":f"{window_years}y","winsorize":"1%-99%","n":int(len(s)),"direction":direction}
          fn="public/indicator_history.json"; d=json.load(open(fn))
          d["adv_dec"]={"freq":"D","unit":"net issues","points":pts,"as_of":pts[-1][0],"stats":compute_stats(pts)}
          json.dump(d,open(fn,"w"),separators=(",",":"))
          print("spliced A/D line; as_of",pts[-1][0])
          mgmt("insert into public.pipeline_health (indicator_id,label,source,cadence,expected_cadence_minutes,status) "
               "values ('adv_dec','Advance-Decline Line','computed','D',1440,'green') on conflict (indicator_id) do nothing;")
          print("seeded/confirmed pipeline_health adv_dec")
          PY
      - name: commit to target branch
        run: |
          git config user.name "macrotilt-bot"
          git config user.email "bot@macrotilt.com"
          git add public/indicator_history.json
          git commit -m "A/D line: standard cumulative breadth, refreshed [skip ci]" || echo "no change"
          git push origin HEAD:${{ inputs.target_branch }}
