name: TICKER-BETAS-DAILY

# Pulls a beta for every held + watchlisted ticker (Yahoo Finance, with a
# prices_eod computed fallback and a high-beta default for thin-history names)
# and writes public/ticker_betas.json. Feeds the Scenario Analysis page so each
# position's scenario shock is beta-adjusted (not just sector-level).

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 11:00 UTC weekdays = ~06:00 ET (Data Steward slow slot)
  workflow_dispatch: {}

concurrency:
  group: ticker-betas-daily
  cancel-in-progress: false

jobs:
  betas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.MACROTILT_BOT_PAT }}
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance requests
      - name: Configure git
        run: |
          git config user.name  "Market Dashboard Bot"
          git config user.email "bot@github-actions"
      - name: Fetch betas
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/fetch_ticker_betas.py
      - name: Commit if updated
        run: |
          git add public/ticker_betas.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to ticker_betas.json."
            exit 0
          fi
          git commit -m "Ticker betas daily refresh [skip ci]"
          for _i in 1 2 3; do git pull --rebase --autostash origin main && git push && break || sleep 4; done
