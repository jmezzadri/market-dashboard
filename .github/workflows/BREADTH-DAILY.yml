name: BREADTH-DAILY
on:
  workflow_dispatch: {}
  # 2026-06-12 (Joe session doctrine) — chain off the overnight price load so
  # breadth reaches the last closed session by ~3:30 AM ET instead of 11 AM.
  # The evening fire computes a preliminary same-evening read; the post-panel
  # morning fire recomputes on the complete panel (idempotent). The 11:00 ET
  # cron stays as a backstop.
  workflow_run:
    workflows: ["MASSIVE-DAILY"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 15 * * 1-5'   # 11:00 ET backstop
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MACROTILT_BOT_PAT }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests openpyxl pandas lxml -q
      - name: compute index breadth (% > 50d/200d EMA) for S&P 500 + Nasdaq-100
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FORCE_RECOMPUTE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          python3 - <<'PY'
          import requests,io,os,re,json,urllib.request,time
          import pandas as pd
          from openpyxl import load_workbook
          U=os.environ['SUPABASE_URL']; TOK=os.environ['SUPABASE_ACCESS_TOKEN']; ref=re.sub(r'^https?://','',U).split('.')[0]
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def mgmt(sql,t=300):
              rq=urllib.request.Request(f"https://api.supabase.com/v1/projects/{ref}/database/query",
                data=json.dumps({"query":sql}).encode(),method="POST",
                headers={"Authorization":"Bearer "+TOK,"Content-Type":"application/json","User-Agent":UA})
              with urllib.request.urlopen(rq,timeout=t) as x: return json.loads(x.read().decode())
          def spy_members():
              r=requests.get("https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/holdings-daily-us-en-spy.xlsx",headers={"User-Agent":UA},timeout=60)
              wb=load_workbook(io.BytesIO(r.content),read_only=True,data_only=True); ws=wb.active
              rows=[list(row) for row in ws.iter_rows(values_only=True)]
              hi=next(i for i,row in enumerate(rows[:12]) if row and any(str(c).strip().lower()=='ticker' for c in row if c))
              ti=[str(c).strip() if c else '' for c in rows[hi]].index('Ticker')
              return sorted({row[ti].strip() for row in rows[hi+1:] if row and ti<len(row) and isinstance(row[ti],str) and row[ti].strip() and row[ti].strip()!='-'})
          def qqq_members():
              # Nasdaq-100 membership. 2026-07-13: Invesco's holdings CSV began
              # returning HTTP 406 (bot-blocked) AND the Wikipedia page stopped
              # exposing a parseable Ticker/Symbol column, so BOTH prior sources
              # failed at once and the NDX leg silently skipped for days while
              # SPX kept publishing (ndx breadth froze at Jul 8). Primary is now
              # Slickcharts (server-rendered constituents table with a Symbol
              # column, ~103 rows); Invesco (with an Accept header) and a
              # heuristic Wikipedia parse remain as fallbacks. Hard-fail if none
              # yields a full list — never compute breadth on a partial universe.
              import csv
              SYM=re.compile(r'^[A-Z][A-Z0-9.\-]{0,6}$')
              def clean(vals):
                  out=[]; seen=set()
                  for v in vals:
                      x=str(v).strip().upper().replace('.','-')
                      if SYM.match(x) and x not in seen:
                          seen.add(x); out.append(x)
                  return sorted(out)
              # Primary: Slickcharts
              try:
                  r=requests.get("https://www.slickcharts.com/nasdaq100",headers={"User-Agent":UA},timeout=40)
                  r.raise_for_status()
                  for t in pd.read_html(io.StringIO(r.text)):
                      for c in t.columns:
                          if 'symbol' in str(c).lower():
                              syms=clean(t[c].tolist())
                              if len(syms)>=90:
                                  print("NDX: Slickcharts members",len(syms)); return syms
                  print("NDX: Slickcharts yielded too few names — falling back to Invesco")
              except Exception as e:
                  print("NDX: Slickcharts fetch failed:",repr(e),"— falling back to Invesco")
              # Fallback 1: Invesco CSV (tolerant scan; sends an Accept header)
              try:
                  r=requests.get("https://www.invesco.com/us/financial-products/etfs/holdings/main/holdings/0?audienceType=Investor&action=download&ticker=QQQ",headers={"User-Agent":UA,"Accept":"text/csv,*/*"},timeout=60)
                  if r.status_code==200 and r.content:
                      txt=r.content.decode('utf-8-sig',errors='ignore')
                      rowsc=list(csv.reader(io.StringIO(txt)))
                      hi=next((i for i,row in enumerate(rowsc[:40]) if any('ticker' in str(c).lower() for c in row)),None)
                      if hi is not None:
                          hdr=[str(c).strip().lower() for c in rowsc[hi]]
                          ci=next((i for i,c in enumerate(hdr) if 'ticker' in c),None)
                          if ci is not None:
                              syms=clean(row[ci] for row in rowsc[hi+1:] if len(row)>ci)
                              if len(syms)>=90:
                                  print("NDX: Invesco members",len(syms)); return syms
                  print("NDX: Invesco unusable (status",r.status_code,") — falling back to Wikipedia")
              except Exception as e:
                  print("NDX: Invesco fetch failed:",repr(e),"— falling back to Wikipedia")
              # Fallback 2: Wikipedia — heuristic (any column that is mostly ticker-shaped)
              try:
                  r=requests.get("https://en.wikipedia.org/wiki/Nasdaq-100",headers={"User-Agent":UA},timeout=30)
                  r.raise_for_status()
                  for t in pd.read_html(io.StringIO(r.text)):
                      for c in t.columns:
                          syms=clean(t[c].tolist())
                          if len(syms)>=90:
                              print("NDX: Wikipedia members",len(syms)); return syms
              except Exception as e:
                  print("NDX: Wikipedia fetch failed:",repr(e))
              raise RuntimeError("NDX membership unavailable from Slickcharts, Invesco AND Wikipedia")
          def pull_closes(tickers, in_years=22, batch=25):
              # Fast INDEXED pull of (ticker, date, close); no recursive CTE. EMA is
              # computed in Python below — the recursion's cost scales with history
              # DEPTH and was timing out at 20y; this does not.
              rows=[]
              for i in range(0,len(tickers),batch):
                  arr="ARRAY["+",".join("'"+t.replace("'","''")+"'" for t in tickers[i:i+batch])+"]"
                  sql=f"""set statement_timeout='100s';
                  select ticker, to_char(trade_date,'YYYY-MM-DD') d, close::float8 c
                  from public.prices_eod
                  where ticker = ANY({arr}) and trade_date >= current_date - interval '{in_years} years' and close is not null
                  order by ticker, trade_date"""
                  for _try in range(3):
                      try: rows += mgmt(sql,t=110); break
                      except Exception as e:
                          if _try==2: raise
                          time.sleep(5)
              return rows
          def breadth(tickers, out_years=20):
              # % of members above their own 50d/200d EMA, per date. EMA via pandas
              # ewm(adjust=False) == the recursive seed-at-first-bar formula exactly
              # (alpha 2/51, 2/201). A member counts only after 50 (resp 200) bars.
              from collections import defaultdict
              byt=defaultdict(list)
              for r in pull_closes(tickers):
                  byt[r['ticker']].append((r['d'], float(r['c'])))
              cutoff=(pd.Timestamp.today()-pd.DateOffset(years=out_years)).strftime("%Y-%m-%d")
              agg={}
              for t,series in byt.items():
                  series.sort()
                  cl=pd.Series([c for _,c in series])
                  e50=cl.ewm(span=50,adjust=False).mean().tolist()
                  e200=cl.ewm(span=200,adjust=False).mean().tolist()
                  for j,(d,c) in enumerate(series):
                      if d < cutoff: continue
                      cur=agg.setdefault(d,[0,0,0,0])
                      if j>=49:
                          cur[1]+=1
                          if c>e50[j]: cur[0]+=1
                      if j>=199:
                          cur[3]+=1
                          if c>e200[j]: cur[2]+=1
              return agg
          def stats(points,direction="lw",wy=3):
              s=pd.Series([p[1] for p in points],index=[pd.Timestamp(p[0]) for p in points]).sort_index()
              s=s[s.index>=s.index.max()-pd.Timedelta(days=365*wy)]
              if len(s)>20: s=s.clip(lower=s.quantile(0.01),upper=s.quantile(0.99))
              return {"mean":round(float(s.mean()),4),"sd":round(float(s.std()),4),"window":f"{wy}y","winsorize":"1%-99%","n":int(len(s)),"direction":direction}
          # 2026-10-12 health sweep (bug #1264, Supabase Disk IO budget): this job
          # re-pulls 22 years of closes for ~600 names on EVERY MASSIVE-DAILY
          # completion — up to six times a day, weekends included — and was the
          # single largest disk reader on the database. Skip the re-pull when the
          # price panel has not changed since the last publish. Signature = latest
          # trade_date + row count on it, so the evening preliminary read and the
          # morning complete-panel recompute (more rows, same date) both still run.
          # A manual dispatch always recomputes.
          sig_r=mgmt("select max(trade_date)::text d, count(*) n from public.prices_eod where trade_date=(select max(trade_date) from public.prices_eod);",t=60)
          panel_sig="%s|%s"%(sig_r[0]["d"],sig_r[0]["n"])
          try: prev_sig=json.load(open("public/indicator_history.json")).get("spx_above_200ema",{}).get("panel_sig")
          except Exception: prev_sig=None
          if prev_sig==panel_sig and os.environ.get("FORCE_RECOMPUTE")!="1":
              print("prices_eod panel unchanged since last publish (%s) - skipping the 22-year re-pull."%panel_sig)
              raise SystemExit(0)
          print("panel signature",panel_sig,"(previous:",prev_sig,") - recomputing")
          out={}; errors=[]
          for code,memfn,k50,k200 in [("SPX",spy_members,"spx_above_50ema","spx_above_200ema"),("NDX",qqq_members,"ndx_above_50ema","ndx_above_200ema")]:
              try:
                  mem=memfn(); print(code,"members",len(mem))
                  agg=breadth(mem); dates=sorted(agg)
                  nmax=max((agg[d][3] for d in dates), default=0)
                  p50=[]; p200=[]
                  for d in dates:
                      a50,n50,a200,n200=agg[d]
                      if n200 < 0.85*nmax: continue
                      if n50>0:  p50.append([d, round(100.0*a50/n50,1)])
                      if n200>0: p200.append([d, round(100.0*a200/n200,1)])
                  out[k50]={"freq":"D","unit":"%","points":p50,"as_of":p50[-1][0],"stats":stats(p50)}
                  out[k200]={"freq":"D","unit":"%","points":p200,"as_of":p200[-1][0],"stats":stats(p200),"panel_sig":panel_sig}
                  print(code,"days",len(p200),"range",p200[0][0],"->",p200[-1][0],"latest %>50d",p50[-1],"%>200d",p200[-1])
              except Exception as e:
                  print(code,"FAILED",repr(e))
                  errors.append("%s: %r"%(code,e))
          # Fail loud (LESSONS 4.5): if EITHER index failed, or the two indices
          # do not agree on the latest session, refuse to publish. Publishing a
          # partial file is exactly what froze NDX at Jul 8 while SPX advanced.
          if errors:
              raise SystemExit("BREADTH producer failed for: "+"; ".join(errors)+" — refusing to publish a partial/stale file.")
          asofs={k:v["as_of"] for k,v in out.items()}
          if len(out)<4:
              raise SystemExit("BREADTH producer produced only %s of 4 series (%s) — refusing to publish."%(len(out),list(out)))
          if len(set(asofs.values()))>1:
              raise SystemExit("BREADTH indices disagree on latest session %s — one index is stale; refusing to publish."%asofs)
          fn="public/indicator_history.json"; d=json.load(open(fn)); d.update(out)
          json.dump(d,open(fn,"w"),separators=(",",":"))
          # Sidecar for the commit step: it re-applies these keys onto whatever
          # main holds at push time (see the commit step, 2026-10-27).
          json.dump(out,open("/tmp/breadth_out.json","w"))
          print("wrote keys:",list(out.keys()))
          vals=",".join("('%s','%s','computed','D',1440,'green')"%(k,k) for k in out)
          if vals:
              mgmt("insert into public.pipeline_health (indicator_id,label,source,cadence,expected_cadence_minutes,status) values "+vals+" on conflict (indicator_id) do nothing;")
              print("seeded pipeline_health")
          PY
      - name: commit
        run: |
          set -euo pipefail
          git config user.name "macrotilt-bot"; git config user.email "bot@macrotilt.com"
          if [ ! -s /tmp/breadth_out.json ]; then echo "no breadth output this run (panel unchanged) - nothing to commit"; exit 0; fi
          # 2026-10-27 (health sweep, LESSONS 5.16 addendum): public/indicator_history.json is ONE
          # minified line, so when another producer commits it between our checkout and our push,
          # `git pull --rebase` does not race - it CONFLICTS, and no retry loop resolves a conflict.
          # 2 of 6 runs (10-26 00:05Z, 10-27 08:40Z) died here with the breadth computed and never
          # published; both collided with MARKET-INDICATORS-EOD, whose 08:40Z morning dispatch
          # (added 10-23 for bug #1274) now lands in the same minute as this chain's post-panel fire.
          # Fix: never rebase the file - reset to origin/main, re-apply our four keys onto whatever
          # is there, commit, push; repeat only on a push race. Idempotent, so a repeat is harmless.
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 - <<'PY'
          import json
          fn="public/indicator_history.json"
          d=json.load(open(fn)); d.update(json.load(open("/tmp/breadth_out.json")))
          json.dump(d,open(fn,"w"),separators=(",",":"))
          PY
            git add public/indicator_history.json
            if git diff --cached --quiet; then echo "breadth keys already on main - no change"; exit 0; fi
            git commit -q -m "Index breadth (% > 50d/200d EMA) refresh [skip ci]"
            if git push origin HEAD:main; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push race on attempt $attempt - re-applying onto latest main in 5s"; sleep 5
          done
          echo "::error::could not push after 6 attempts - this is a real failure, not a race"; exit 1
