name: PAPER-PORTFOLIO-EOD-DAILY

# MacroTilt paper-portfolio EOD phase — queues at-the-open (opg) orders.
#   0. Trading-day gate (IN THE RUNNER, added 2026-07-03): the broker
#      calendar must say TODAY is a session, or the phase no-ops before
#      the translator writes anything. Weekday crons fire on weekday
#      market HOLIDAYS — on 2026-07-03 (July 4 observed) this queued 11
#      next-open orders + emailed a rebalance summary on a closed market.
#      Holidays exit quietly; a calendar ERROR blocks + files a P1.
#   1. Translator: Asset Tilt + Stock Scanner -> pending paper_orders rows.
#   2. Freshness gate: BOTH sleeves must be current for the last closed
#      trading session, else skip + P1 alert (no stale trade ever fires).
#   3. Submitter: pending -> Alpaca opg (auction) orders for today's open.
#
# ---------------------------------------------------------------------------
# 2026-06-01 ROOT-CAUSE FIX (Data Steward + Lead Developer + Senior Quant)
# ---------------------------------------------------------------------------
# It had NEVER successfully traded in its first week. Two stacked causes:
#  (a) Orders are opg (at-the-open). Alpaca only ACCEPTS opg orders between
#      7:00pm and 9:28am ET. The job submitted in a morning window jammed
#      against 9:28am, and GitHub crons land 1-4h late, so every real fire
#      hit Alpaca AFTER 9:28am -> HTTP 403 rejected.
#  (b) There was NO freshness gate despite comments claiming one.
#
# Data-availability facts (verified from run logs 2026-06-01):
#  * Stock sleeve (Screener) scores the prior close only AFTER the overnight
#    full price batch lands (~2:30-3:00am ET).
#  => Earliest the Screener sleeve is fresh = ~3:00am ET.
#     Alpaca opg cutoff = 9:28am ET. So submit in the EARLY MORNING with a
#     wide accept window and many redundant fires; the first in-window fire
#     queues the auction orders, the rest are idempotent no-ops.
#
# Accept window: 03:00-09:25 ET (was 08:00-09:25). Fires every 30 min from
# 04:00 to 08:30 ET so even a multi-hour-late GitHub delivery still lands
# in-window with margin before 9:28am.

# Cron re-armed 2026-07-15 after the account-reset pause (LESSON 4.13:
# a disabled->re-enabled workflow's schedule does not resume without a
# commit touching this file).
on:
  schedule:
    # Cron is UTC. EDT = UTC-4. 08:00 UTC = 04:00 ET ... 12:30 UTC = 08:30 ET.
    # Duplicated +1h for EST coverage (09:00-13:30 UTC). Idempotent.
    - cron: '0 8 * * 1-5'
    - cron: '30 8 * * 1-5'
    - cron: '0 9 * * 1-5'
    - cron: '30 9 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '30 10 * * 1-5'
    - cron: '0 11 * * 1-5'
    - cron: '30 11 * * 1-5'
    - cron: '0 12 * * 1-5'
    - cron: '30 12 * * 1-5'
    - cron: '0 13 * * 1-5'
    - cron: '30 13 * * 1-5'
  # Chain off the morning signal producer so we fire the moment fresh
  # signals land. The accept-window guard (03:00–09:25 ET) + idempotent
  # submitter make extra fires safe.
  # MONITOR-RECONCILE added 2026-07-06: the only schedule that fired the morning
  # GitHub dropped the entire 08:00-13:30 UTC cron block (incl. all 7 fires of
  # this workflow). Its ~12:00 UTC fire lands ~08:00 ET, inside the accept
  # window; off-hour fires no-op on the window/calendar/idempotence guards.
  workflow_run:
    workflows: ["SCREENER_TRADING_OPPS_DAILY", "MONITOR-RECONCILE"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (compute, no DB writes, no Alpaca submission)'
        required: false
        default: 'false'

concurrency:
  group: paper-portfolio-eod
  cancel-in-progress: false

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Pre-open submit window guard
        id: window
        # Accept 03:00-09:25 ET. opg orders route to the 09:30 open whenever
        # submitted pre-open, and both sleeves are fresh by ~3am, so an early
        # fire is correct. Manual dry-runs always proceed.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch - proceeding."
            exit 0
          fi
          H=$(TZ=America/New_York date +%H)
          M=$(TZ=America/New_York date +%M)
          MINS=$((10#$H * 60 + 10#$M))
          # 03:00 ET = 180 min, 09:25 ET = 565 min.
          if [ "$MINS" -ge 180 ] && [ "$MINS" -le 565 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Pre-open window ($H:$M ET) - proceeding."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Outside pre-open window ($H:$M ET) - no-op."
          fi

      - name: Check out market-dashboard
        if: steps.window.outputs.proceed == 'true'
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        if: steps.window.outputs.proceed == 'true'
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.window.outputs.proceed == 'true'
        run: pip install requests pandas pyarrow numpy scipy

      - name: Run EOD phase (translator + freshness gate + submitter)
        if: steps.window.outputs.proceed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN:        ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          ALPACA_PAPER_KEY_ID:          ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET:          ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_PAPER_BASE_URL:        ${{ secrets.ALPACA_PAPER_BASE_URL }}
          PAPER_LIVE_TRADING_ENABLED:   "false"   # RETIRED 2026-08-11: the two-sleeve translator must never trade again. On cutover morning it woke up and queued FSBC + CMCO (~$1M of retired-strategy orders) beside the Conviction book because the repo SECRET still read "true". Hardcoded off so no secret value can revive it; these workflows remain for bookkeeping/manual tools only.
          MOMENTUM_SLEEVE_ENABLED:      "true"
          SMTP_USER:                    ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:                ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO:                     ${{ secrets.EMAIL_TO }}
          EMAIL_FROM:                   ${{ secrets.EMAIL_FROM }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m paper_portfolio.runner --phase eod --dry-run
          else
            python -m paper_portfolio.runner --phase eod
          fi
