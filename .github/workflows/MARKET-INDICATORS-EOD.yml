# MARKET-INDICATORS-EOD — daily commodity + FX market levels for Macro Overview.
#
# WHY
# ───
# The Commodities and FX asset-class tiles read daily market prices (gold,
# silver, copper, uranium, oil, natural gas, grains; euro, yen, pound) ranked
# into each series' own trailing 3-year range. This job pulls them from Yahoo
# and MERGES them into public/indicator_history.json (never overwrites — the
# producer refuses to drop any existing key).
#
# SCHEDULE
# ────────
# Weekdays 20:45 UTC (16:45 ET EDT) — after the US equity/futures close.
# Plus a morning pass every weekday: the vendor often has no close for the
# session that just ended until hours later, so the morning pass is what lands
# the previous day's settle (added 2026-10-09; weekdays 06:45 + 09:30 UTC as
# the GitHub backup, pg_cron 06:40 + 08:40 UTC Mon-Fri as the primary since
# 2026-10-23/26 — see the schedule block). GitHub starts its own crons late —
# observed 2 to 7 hours after the scheduled time.
# Uranium is weekly by nature; it is pulled on every run and simply ranks
# once enough history accrues.
#
# OUTPUTS
# ───────
# public/indicator_history.json keys cmdty_*, fx_* and credit_bdc_pnav
# (plus public/bdc_nav.json per-BDC detail) — consumed by the
# Macro Overview Commodities + FX tiles, All Indicators, and Methodology.
# Freshness: registered in data_manifest.json (daily, 49h SLA, nyse calendar;
# uranium weekly). Chips read manifest SLA + served as_of.

name: MARKET-INDICATORS-EOD

on:
  schedule:
    - cron: "45 20 * * 1-5"      # weekdays 20:45 UTC = 16:45 ET (EDT)
    # Morning pass (2026-10-09, Tue-Sat then; Mon-Fri since 2026-10-26). The vendor shows the session that
    # just ended with no close for some hours, so the evening run often cannot
    # read that day's settle; by the next morning it is there. Without this
    # pass the newest close on the site is a full day behind until evening.
    # 2026-10-22 (health sweep, bug #1274): GitHub starts this repo's crons
    # 2-7 hours after the schedule line (every cron, every day since at least
    # September — read from the run history, LESSONS 4.41). A 09:30 UTC pass
    # therefore ran at 13:00-14:35 UTC all week, AFTER the US open, and the
    # Nikkei tile showed the prior session every pre-open even though the
    # per-exchange cutoff fix (#1819) was correct. The first morning pass now
    # sits right after Tokyo's 15:30 JST close (06:30 UTC): with the measured
    # delay it lands ~08:45-12:00 UTC, before Joe's 6am ET look most days.
    # 09:30 stays as the second attempt. The fetcher merges, so both are
    # idempotent. The schedule line is set for when the job really RUNS.
    # 2026-10-23 (health sweep, bug #1274 fifth day): the 06:45 UTC cron did
    # not start at all by 11:20 UTC on its first morning. The pre-open pass is
    # therefore no longer a GitHub cron: pg_cron `market_tape_morning_dispatch()`
    # (supabase/migrations/20261023_market_tape_morning_dispatch.sql) fires a
    # workflow_dispatch of THIS workflow at 06:40 and 08:40 UTC Mon-Fri, guarded
    # by pipeline_health.n225_index.data_as_of — a dispatch starts in seconds,
    # only `schedule:` events are delayed. The two lines below stay as the
    # redundant path (LESSONS 5.2: the GitHub cron is the backup, never the
    # only timer for a pre-open deliverable).
    # 2026-10-26 (health sweep, bug #1274 sixth day): Tue-Sat was a day shifted.
    # Tokyo's session ends 06:30 UTC on the SAME calendar day, so Friday's
    # close lands Friday morning, Saturday has nothing to land, and MONDAY's
    # close had no morning pass at all — the first Monday after the pg_cron
    # fix showed Friday's Nikkei (and Friday's Bitcoin) at the pre-open. Both
    # the pg_cron fires (20261026_market_tape_morning_dispatch_weekdays.sql)
    # and these backup lines are Mon-Fri now.
    - cron: "45 6 * * 1-5"       # 06:45 UTC = 02:45 ET (EDT); after Tokyo close (backup to pg_cron)
    - cron: "30 9 * * 1-5"       # 09:30 UTC = 05:30 ET (EDT); second attempt (backup to pg_cron)
  workflow_dispatch:
    inputs:
      seed_uranium:
        description: "One-time: seed ~25y monthly uranium history from IndexMundi"
        type: boolean
        default: false
      reseed:
        description: "One-time: replace commodity/FX series with a clean full daily pull"
        type: boolean
        default: false

concurrency:
  group: market-indicators-eod
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MACROTILT_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests numpy
      - name: Pull commodity + FX market levels (merge into indicator_history.json)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MKT_SEED_URANIUM:          ${{ inputs.seed_uranium && '1' || '' }}
          MKT_RESEED:                ${{ inputs.reseed && '1' || '' }}
        run: python3 scripts/fetch_market_indicators.py
      # 2026-10-07: private-credit gauge — listed BDCs' price vs their filed NAV.
      # Its own step so an SEC hiccup never blocks the commodity/FX refresh.
      - name: Listed BDC price / NAV (merge into indicator_history.json)
        continue-on-error: true
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/fetch_bdc_nav.py --selftest && python3 scripts/fetch_bdc_nav.py
      - name: Commit if updated
        run: |
          if git diff --quiet -- public/indicator_history.json && [ -z "$(git status --porcelain -- public/bdc_nav.json)" ]; then
            echo "No changes to commit."
          else
            git config user.name  "Market Dashboard Bot"
            git config user.email "bot@github-actions"
            git add public/indicator_history.json public/bdc_nav.json
            git commit -m "Market indicators (commodities + FX) EOD refresh [skip ci]"
            for _i in 1 2 3; do git pull --rebase --autostash origin main && git push && break || sleep 4; done
          fi
