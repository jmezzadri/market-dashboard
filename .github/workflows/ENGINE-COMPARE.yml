name: ENGINE-COMPARE
# One-shot head-to-head: OLD MacroTilt engine vs NEW reworked engine, same basis.
on: { workflow_dispatch: {} }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MACROTILT_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests -q
      - name: Engine head-to-head
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PYTHONPATH: scripts
        run: python3 scripts/engine_compare.py
      - name: Commit result
        run: |
          git config user.name "Market Dashboard Bot"
          git config user.email "bot@github-actions"
          git add public/engine_compare.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "Engine head-to-head result [skip ci]"
            for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push && break || sleep 5; done
          fi
