name: CONVICTION-OPEN-DAILY (DISABLED)

# DISABLED 2026-08-12 - automated trading halted. Nothing here trades.
# Temporarily doubles as the agent's repo-tree read-back (dispatch-only).

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Halted
        run: echo "::warning::CONVICTION-OPEN-DAILY is DISABLED. No orders are placed."
      - name: Dump repo tree for agent read-back
        run: |
          mkdir -p public
          git ls-files > public/_repo_tree.txt
          wc -l public/_repo_tree.txt
          git config user.name "MacroTilt Agent"
          git config user.email "agent@macrotilt.com"
          git add public/_repo_tree.txt
          git commit -m "chore: repo tree read-back" || exit 0
          git push
