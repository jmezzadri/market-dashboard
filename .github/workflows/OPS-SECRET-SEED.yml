name: OPS-SECRET-SEED

# One-shot utility (2026-07-06, LESSONS 4.17 follow-up). Seeds/refreshes the
# GitHub dispatch token used by the Vercel morning-ensure backstop into the
# RLS-locked, service-role-only Supabase table ops_secrets. Runs INSIDE GitHub
# Actions so the token and the service-role key never leave the secret stores.
# Safe to re-run any time (upsert). Dispatch-only; no schedule.

on:
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Upsert github_dispatch into ops_secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN: ${{ secrets.MACROTILT_BOT_PAT }}
        run: |
          for v in SUPABASE_URL KEY TOKEN; do
            [ -n "$(eval echo \$$v)" ] || { echo "::error::$v secret is empty/missing"; exit 1; }
          done
          code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/ops_secrets" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"name\":\"github_dispatch\",\"value\":\"$TOKEN\",\"note\":\"GitHub PAT for Vercel morning-ensure dispatch (seeded by OPS-SECRET-SEED)\"}")
          echo "PostgREST status: $code"
          { [ "$code" = "201" ] || [ "$code" = "200" ]; } || { cat /tmp/resp; exit 1; }
