name: PAPER-PORTFOLIO-CLOSE-DAILY

# MacroTilt paper-portfolio CLOSE-of-business snapshot — the daily record the
# Paper Portfolio page displays (Joe directive 2026-06-10: every P&L number
# on that page is marked as of the close, never midday).
#   1. mirror_fills      — pull Alpaca fills since the last successful run.
#   2. mirror_positions  — write today's snapshot at OFFICIAL session closes
#                          (daily bars, immune to after-hours drift if the
#                          cron fires late).
#   3. write_nav_daily   — today's NAV row, valued at the same closes so the
#                          Performance card ties to the sleeve tables to the
#                          cent.
# Next morning the open phase certifies these closes against prices_eod
# (Polygon's full T+1 panel), keeping the site's single-price-source rule.
#
# Pipeline name (Data Steward convention): paper-portfolio-close-daily
#
# Schedule (cron is UTC; both DST siblings fire — the run is idempotent and
# self-skips when there is no settled session bar):
#   * 20:50 UTC = 4:50 PM EDT — 50 min after the close; official daily bars
#     are published within minutes of 4:00 PM ET.
#   * 21:50 UTC = 4:50 PM EST sibling (= 5:50 PM EDT in summer; harmless
#     rerun of the same official closes).
#
# Required GitHub secrets: same as the EOD/OPEN workflows.

on:
  schedule:
    - cron: '50 20 * * 1-5'
    - cron: '50 21 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (compute, no DB writes)'
        required: false
        default: 'false'

concurrency:
  group: paper-portfolio-close
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out market-dashboard
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests pandas pyarrow numpy scipy

      - name: Run close phase (official-close positions + NAV snapshot)
        # Mirror phase has no live-submission risk — it only READS from
        # Alpaca and WRITES to Supabase snapshot tables. The live-trading
        # kill-switch governs the EOD phase; mirror always runs as-is.
        env:
          SUPABASE_ACCESS_TOKEN:        ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          ALPACA_PAPER_KEY_ID:          ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET:          ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_PAPER_BASE_URL:        ${{ secrets.ALPACA_PAPER_BASE_URL }}
          PAPER_LIVE_TRADING_ENABLED:   "true"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m paper_portfolio.runner --phase close --dry-run
          else
            python -m paper_portfolio.runner --phase close
          fi

      - name: Stamp pipeline_health freshness (portfolio_history, after close)
        # DURABLE FRESHNESS STAMP (added 2026-06-16). The close phase writes the
        # daily portfolio snapshot (portfolio_history) every weekday but NEVER
        # stamped pipeline_health, so the freshness monitor read its last_good_at
        # as frozen and the Admin · Data chip went RED even though the snapshot
        # was current. A producer that publishes a fresh snapshot MUST stamp its
        # own pipeline_health row, or the chip lies. Honest stamp — data_as_of =
        # the close session date in ET (the bar this snapshot records),
        # last_good_at = now. Skipped on dry-run (no DB writes happened).
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          AS_OF=$(TZ=America/New_York date +%F)
          python scripts/upsert_pipeline_health.py portfolio_history "$AS_OF" green

      - name: Stamp pipeline_health red on failure (portfolio_history)
        if: failure()
        env:
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/upsert_pipeline_health.py portfolio_history - red "PAPER-PORTFOLIO-CLOSE-DAILY failed before publish (Actions run ${{ github.run_id }})"
