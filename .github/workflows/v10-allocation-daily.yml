name: v10-allocation-daily

# Daily compute of the v10 allocator. Reads public/cycle_board_snapshot.json
# (refreshed nightly by cycle-mechanisms-daily) and writes
# public/v10_allocation.json with today's recommended allocation.
#
# Schedule: ~03:00 ET (07:00 & 07:30 UTC) Tue-Sat. Runs early morning — after
# the cycle board is final the prior evening (18:30 ET) and BEFORE the paper
# rebalancer's 04:00 ET submit window — so the sector sleeve (Asset Tilt) is
# fresh when the rebalancer reads it. (Was 08:15 ET, which landed after the
# rebalancer gave up — the 2026-06-16 stale-sector refusal.)

on:
  schedule:
    # EARLY-MORNING runs (moved 2026-06-16, supersedes the 08:15 ET design).
    # The sector sleeve (Asset Tilt) MUST publish before the paper rebalancer's
    # submit window opens at 04:00 ET (08:00 UTC). The prior 08:15 ET schedule
    # landed AFTER the rebalancer had already given up, so the rebalancer read
    # a stale sector signal and refused to trade (2026-06-16 incident). The
    # allocator's only input is public/cycle_board_snapshot.json, final the
    # prior evening at 18:30 ET, so it can run any time after that. We run at
    # ~03:00 ET — in step with the Trading Ops scanner (both reflect the prior
    # close) and before the rebalancer window. Still aligned on the same close;
    # only the clock time moved earlier, so the allocation math is unchanged.
    # Tue-Sat = the morning after each trading day. 07:00 UTC = 03:00 ET (EDT)
    # / 02:00 ET (EST); 07:30 UTC is a redundant second fire. Idempotent.
    - cron: "0 7 * * 2-6"
    - cron: "30 7 * * 2-6"
  workflow_dispatch:
  # RE-ADDED 2026-06-17 (reliability): GitHub's scheduler dropped the morning
  # crons two days running (06-16 and 06-17), leaving the sector sleeve a
  # session stale and the paper rebalance blocked both mornings. Make the
  # refresh EVENT-DRIVEN off the cycle board (the allocator's only input):
  # when the board finishes refreshing after the close, recompute immediately
  # so the sector signal is ready overnight regardless of cron reliability.
  # The 2026-06-12 removal was for two reasons now moot: (a) the old chain ran
  # on a T-1 panel — but the board carries the actual close date, so the
  # allocation is on the right session; (b) it raced the board commit on main
  # — but the commit step below now has a 3-attempt rebase-retry that survives
  # the race. The morning crons stay as a backup.
  workflow_run:
    workflows: ["cycle-mechanisms-daily"]
    types: [completed]

concurrency:
  group: v10-allocation-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compute:
    # On the cycle-board chain, only run if the board actually succeeded;
    # scheduled and manual runs always proceed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Bot PAT (admin) bypasses main's required status checks, which block
          # the default Actions token from pushing data commits (Joe 2026-06-03).
          token: ${{ secrets.MACROTILT_BOT_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Snapshot prior sector weights (for the Prev column)
        # Capture the sector weights we are about to overwrite into a rolling
        # history so the Asset Tilt table can show last-week's recommended
        # allocation. Deduped by as_of, capped at 60 entries. (Joe 2026-06-03)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cur = Path("public/v10_allocation.json")
          hist = Path("public/v10_sector_history.json")
          if not cur.exists():
              raise SystemExit(0)
          d = json.loads(cur.read_text())
          snap = {
              "as_of": d.get("as_of"),
              "sectors": [{"sector": s["sector"], "dollar": s.get("dollar")} for s in d.get("sectors", [])],
          }
          h = json.loads(hist.read_text()) if hist.exists() else {"snapshots": []}
          snaps = h.get("snapshots", [])
          snaps = [x for x in snaps if x.get("as_of") != snap["as_of"]]
          snaps.append(snap)
          snaps = snaps[-60:]
          hist.write_text(json.dumps({"snapshots": snaps}, indent=2) + "\n")
          print(f"sector-history: {len(snaps)} snapshots, latest {snap['as_of']}")
          PY

      - name: Run v10 allocator
        run: python scripts/compute_v10_allocation.py

      - name: Audit hard rules
        run: |
          python -c "
          import json
          d = json.load(open('public/v10_allocation.json'))
          audit = d['rule_audit']
          assert audit['max_defensive_50pct'], 'defensive exceeds 50%'
          assert audit['max_leverage_1_5x'], 'leverage exceeds 1.5x'
          assert audit['defensive_xor_leverage'], 'defensive AND leverage both on'
          assert audit['all_6_mechanisms_used'], 'not all 6 mechanisms feeding'
          print('v10 audit OK |', d['as_of'], '| equity', d['equity_pct'], '| defensive', d['defensive_pct'], '| leverage', d['leverage'])
          "

      - name: Commit if changed
        run: |
          git config user.name "macrotilt-bot"
          git config user.email "macrotilt-bot@users.noreply.github.com"
          git add public/v10_allocation.json public/v10_sector_history.json
          if git diff --cached --quiet; then
            echo "No changes — skipping."
          else
            git commit -m "chore(data): refresh v10_allocation — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Nightly data committers race each other on main (2026-06-11: the
            # cycle-board commit landed first and this push was REJECTED — the
            # refreshed allocation never published). Rebase + retry, then fail
            # loudly so the red-stamp step and the failure alert both fire.
            ok=""
            for i in 1 2 3; do
              if git push; then ok=1; break; fi
              echo "push rejected (attempt $i) — rebasing onto latest main"
              git pull --rebase origin main
            done
            if [ -z "$ok" ]; then echo "::error::push failed after 3 rebase retries"; exit 1; fi
          fi

      - name: Stamp pipeline_health freshness (after publish)
        # Stamp ONLY after the file is actually on main. The old order stamped
        # green BEFORE the commit step — on 2026-06-11 the push was rejected
        # and the row read green for a publish that never happened: fake-green
        # (LESSONS 0.1). The chip grades pipeline_health, so stamp = publish.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          AS_OF=$(python -c "import json;print(json.load(open('public/v10_allocation.json'))['as_of'])")
          python scripts/upsert_pipeline_health.py v10_allocation "$AS_OF" green

      - name: Stamp pipeline_health red on failure
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/upsert_pipeline_health.py v10_allocation - red "v10-allocation-daily failed before publish (Actions run ${{ github.run_id }})"
