# REFRESH-ISM-MONTHLY — monthly refresh of ISM Manufacturing + Services PMI.
#
# WHY
# ───
# ISM PMI data is license-restricted on FRED (NAPM and family series all
# return 400). The primary free path is to scrape investing.com's
# economic-calendar pages once a month, after both Mfg and Svc have
# published the prior month's reading.
#
# JUNE 2026 — investing.com began returning HTTP 403 to GitHub Actions IPs,
# so every run failed at the scrape step and the May readings never landed:
# ism_mfg / ism_svc showed status=no_data on the cycle board. Two fixes:
#   1. scripts/refresh_ism.py no longer aborts on a scrape 403 — it keeps the
#      Supabase-hydrated history and a curated real-value fallback (latest
#      published ISM readings) so the newest month still lands.
#   2. This workflow now (a) passes SUPABASE_URL + SERVICE_ROLE_KEY so the
#      hydrate backstop can actually run, and (b) checks out / pushes with the
#      admin bot token so the commit isn't rejected by branch protection
#      (GH006), per LESSONS 2026-06-01.
#
# SCHEDULE
# ────────
# - Mfg releases on the 1st business day of the new month at ~10:00 ET.
# - Svc releases on the 3rd business day at ~10:00 ET.
# - Run on the 5th of every month at 14:00 UTC (10:00 ET) so both are out.
# - Plus weekly retry every Monday during the first 14 days as a safety net.
#
# IDEMPOTENCE
# ───────────
# Re-running with no new readings is a no-op — the script writes
# indicator_history.json only when it appends new data or hydrates.

name: REFRESH-ISM-MONTHLY

on:
  schedule:
    - cron: "0 14 5 * *"           # the 5th of every month, 14:00 UTC = 10:00 ET
    - cron: "0 14 1-14 * 1"        # every Monday in the first 14 days, retry safety net
  workflow_dispatch: {}             # manual trigger

concurrency:
  group: refresh-ism-monthly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MACROTILT_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run refresh_ism.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/refresh_ism.py
      - name: Commit if updated
        run: |
          if [[ -z "$(git status --porcelain public/indicator_history.json)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "macrotilt-bot"
          git config user.email "macrotilt-bot@users.noreply.github.com"
          git add public/indicator_history.json
          git commit -m "ISM PMI monthly refresh — $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push attempt $i failed — rebasing onto latest main"
            git pull --rebase origin main || true
          done
          echo "ERROR: could not push after 5 attempts"; exit 1
