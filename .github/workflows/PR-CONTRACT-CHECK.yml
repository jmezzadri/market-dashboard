name: PR-CONTRACT-CHECK

# Producer/consumer contract check. Fires on any PR that touches a
# JSON producer (indicator/composite recompute scripts), a public/*.json
# file, or a frontend file that consumes them.
# See LESSONS.md rule #29.

on:
  pull_request:
    paths:
      - "fetch_history.py"
      - "compute_composite_history.py"
      - "scripts/**"
      - "public/*.json"
      - "src/App.jsx"
      - "src/pages/**"
      # 2026-08-18: widened from just this file to all of .github/workflows/**,
      # so that ADDING a scheduled workflow runs the watchlist guard below.
      - ".github/workflows/**"

jobs:
  contract-check:
    name: Validate producer/consumer contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run contract checker (local mode)
        run: python scripts/check_producer_contracts.py

      # 2026-08-18: WORKFLOW_FAILURE_ALERT matches on a workflow's `name:`, so a
      # misspelled entry is a silent no-op and an ABSENT one means that
      # workflow's failures are never even recorded. Four dead entries and 25
      # unwatched scheduled workflows were live when this guard was written —
      # none of it visible without looking. Now it is a test.
      - name: Alert watchlist matches the real workflows
        run: |
          python -m pip install --quiet pyyaml
          python scripts/test_workflow_alert_watchlist.py
