name: DAILY-BRIEF-WRITER

# ONE cloud generator for the daily market brief (Joe directive 2026-06-25).
# Runs on GitHub's servers pre-market every weekday — independent of any laptop.
# Builds the brief from the two live brief feeds + web search, writes the SITE
# feed (public/daily_brief.json) AND sends the branded email from the SAME JSON,
# so the site and the email always carry the same messaging and the email's
# macrotilt.com link lands on a matching brief.
#
# Rollout safety: BRIEF_SEND_MODE=test (below) emails ONLY the SMTP user (Joe),
# so the existing 7am email pipeline is never disturbed while we validate. Flip
# to 'live' (and retire the old routine) once the new email is confirmed good.
#
# Pipeline name (Data Steward convention): commentary-daily-brief-daily
# Required secrets: ANTHROPIC_API_KEY, SMTP_USER, SMTP_PASSWORD, EMAIL_TO,
#   EMAIL_FROM (optional), SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, MACROTILT_BOT_PAT

# 2026-06-30 RE-ARM: this workflow was manually disabled during the 2026-06-29
# incident and re-enabled, but its scheduled trigger stayed dormant -- GitHub does
# not reliably resume a disabled schedule until a NEW COMMIT touches the workflow
# file on the default branch. Result: the 06:15 ET cron silently never fired for
# three straight weekdays and the homepage froze. Committing this file re-registers
# the schedule. Do NOT disable this workflow; if you ever must, re-commit to re-arm.

on:
  schedule:
    - cron: '15 10 * * 1-5'   # 06:15 ET (EDT)
    - cron: '15 11 * * 1-5'   # 06:15 ET (EST) sibling
  workflow_run:
    # GitHub's cron scheduler has repeatedly dropped THIS workflow's own schedule
    # (6/26, 6/29, 7/1) while other workflows fire fine. So we ALSO trigger off the
    # completion of workflows that DO fire reliably every morning. The writer is
    # idempotent (skips when the brief is already today's), so being triggered many
    # times a morning is harmless -- it generates at most once. This is the reliable path.
    # 2026-08-28 (health sweep): this list could never send the email, and on
    # 2026-08-28 that finally showed. PAPER-PORTFOLIO-EOD-DAILY has been retired
    # since 2026-08-14 — a dead name in a list that reads as coverage. The two
    # live ones fire, but they COMPLETE at 08:12–08:38 UTC, i.e. 04:12–04:38 ET,
    # and build_daily_brief.py refuses to touch "today's" brief before 05:00 ET
    # (BUILD_FROM_HOUR_ET). So all five of today's chained runs returned
    # `skipped_too_early`, GitHub dropped this workflow's own 10:15 UTC cron
    # (4.13/4.17), and Joe got no brief email at all. A trigger that always
    # lands outside the window it is meant to serve is not a backup.
    #
    # INDICATOR-REFRESH_7AM_WEEKDAYS starts at 11:05 UTC (07:05 ET) and is one
    # of the most reliable jobs in the repo — it completes AFTER the morning
    # session commits the brief (observed spread 10:12–11:20 UTC) and INSIDE
    # send_email's 05:00–09:59 ET window. The writer is idempotent and the send
    # carries an atomic once-per-day claim, so extra fires cost nothing.
    workflows: ["INDICATOR-REFRESH_7AM_WEEKDAYS", "MASSIVE-DAILY", "MONITOR-RECONCILE"]
    types: [completed]
  workflow_dispatch:
    inputs:
      send_mode:
        description: "Email recipients: test (Joe only) or live (full list)"
        required: false
        default: "live"
      force:
        description: "Regenerate even if today's brief already exists (1 = force)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MACROTILT_BOT_PAT }}   # admin PAT bypasses required checks

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build brief + send email (stdlib only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRIEF_SEND_MODE: ${{ github.event.inputs.send_mode || 'live' }}
          # 2026-07-30: this writer is now the SOLE emailer of Joe's morning brief. The
          # legacy 05:45 ET scheduled-task emailer produced a brief from an un-auditable
          # prompt and shipped two fabricated claims (an AAPL/AMZN beat on a day neither
          # had reported; a 30-year yield "easing back" while it made a new high). Site
          # and email now come from ONE hardened generator, so both carry the same
          # messaging and the prompt lives in version control where it can be reviewed.
          BRIEF_SEND_EMAIL: "true"
          BRIEF_FORCE_REBUILD: ${{ github.event.inputs.force || '0' }}
        run: python scripts/build_daily_brief.py

      - name: Verify brief is current + well-formed
        run: |
          # The writer deliberately does nothing off a trading day or before 05:00 ET
          # (this workflow is also fired by workflow_run on pipelines that run at 2am).
          # A skip is a correct outcome, not a failure -- asserting "date == today"
          # unconditionally would turn every weekend run into a red build and a
          # WORKFLOW_FAILURE_ALERT email to Joe.
          STATUS="$(cat /tmp/brief_status.txt 2>/dev/null || echo unknown)"
          if [ "$STATUS" != "generated" ] && [ "$STATUS" != "already_current" ]; then
            echo "writer skipped on purpose ($STATUS) — nothing to verify"
            exit 0
          fi
          test -s public/daily_brief.json
          python -c "
          import json, datetime
          from zoneinfo import ZoneInfo
          d = json.load(open('public/daily_brief.json'))
          today = datetime.datetime.now(ZoneInfo('America/New_York')).strftime('%Y-%m-%d')
          assert d.get('date') == today, f'brief date {d.get(\"date\")} != today {today}'
          assert d.get('headline'), 'missing headline'
          assert isinstance(d.get('sections'), list) and d['sections'], 'sections empty'
          print('brief OK', d['date'], '-', d['headline'][:70])
          "

      - name: Commit brief if changed
        if: ${{ (github.event.inputs.send_mode || 'live') == 'live' }}
        run: |
          git config user.name "macrotilt-bot"
          git config user.email "macrotilt-bot@users.noreply.github.com"
          git add public/daily_brief.json
          if [[ -n "$(git diff --cached --name-only)" ]]; then
            git commit -m "Daily brief — $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main   # another workflow may have pushed since checkout
            git push
          else
            echo "No change to daily brief"
          fi
