name: ANTHROPIC-API-DIAG

# Manual-only diagnostic: the daily-brief writer has been dying since 2026-08-03
# with a bare "HTTP Error 400: Bad Request" from api.anthropic.com (urllib hides
# the response body). This job reproduces the call three ways and PRINTS the
# error body so we can tell apart: exhausted credits vs retired model vs a
# sunset web_search tool version. No site artifact is touched. Delete when done.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe /v1/messages three ways
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error

          KEY = os.environ["ANTHROPIC_API_KEY"]

          def probe(label, body):
              req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages",
                  data=json.dumps(body).encode(),
                  headers={"x-api-key": KEY, "anthropic-version": "2023-06-01",
                           "content-type": "application/json"},
                  method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      resp = json.loads(r.read().decode())
                      print(f"[{label}] OK — model={resp.get('model')} stop={resp.get('stop_reason')}")
              except urllib.error.HTTPError as e:
                  print(f"[{label}] HTTP {e.code} — body: {e.read().decode(errors='replace')[:600]}")
              except Exception as e:
                  print(f"[{label}] {type(e).__name__}: {e}")

          msg = [{"role": "user", "content": "Reply with the single word: ok"}]
          # 1. Exactly what build_daily_brief.py sends (model + web_search tool)
          probe("brief-shape sonnet-4-6 + web_search",
                {"model": "claude-sonnet-4-6", "max_tokens": 32,
                 "tools": [{"type": "web_search_20250305", "name": "web_search", "max_uses": 1}],
                 "messages": msg})
          # 2. Same model, no tools — isolates the tool spec
          probe("sonnet-4-6 plain",
                {"model": "claude-sonnet-4-6", "max_tokens": 32, "messages": msg})
          # 3. Different model, no tools — isolates the model id / account state
          probe("haiku-4-5 plain",
                {"model": "claude-haiku-4-5", "max_tokens": 32, "messages": msg})
          EOF
