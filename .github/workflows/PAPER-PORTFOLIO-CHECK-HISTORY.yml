name: PAPER-PORTFOLIO-CHECK-HISTORY
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Audit historical rejected orders (read-only)
        env:
          SUPABASE_ACCESS_TOKEN:  ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALPACA_PAPER_KEY_ID:    ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET:    ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_PAPER_BASE_URL:  ${{ secrets.ALPACA_PAPER_BASE_URL }}
        run: python -m scripts.paper_check_history
