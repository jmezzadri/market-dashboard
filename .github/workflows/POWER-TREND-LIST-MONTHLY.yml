name: POWER-TREND-LIST-MONTHLY

# Pipeline: equity-power_trend_list-monthly — the Power Trend sleeve's monthly
# ranked list (replaces the retired 12-1 momentum list; the Faber crash guard
# is retired with it — a zero-signal month publishes a CASH sentinel row and
# the paper engine reads a CASH-only list as all-cash).
#
# The screen runs server-side (public.power_trend_scan, migration 081 —
# validated logic): liquid US common stock universe (strategy_bt_universe),
# 63-day ROC top-20% cross-sectional, relative strength >= 5 points vs SPY,
# new 10-day closing high on > 1.3x 20-day avg volume, close above the
# 10/21/50/200 EMAs. The producer caps the list at 15 names (roc_3m desc,
# ticker-asc tiebreak) via shared scripts/power_trend_rules.py.
#
# Writes public.power_trend_list — append-only across rebalance_dates,
# delete+rewrite within one (idempotent; safe to re-fire).
#
# Schedule: 1st of the month 06:00 ET (schedule-normalization rule: monthly
# on the 1st, slow-data slot). Double cron across DST; idempotent.
#
# Consumers: Trading Scanner -> Power Trend panel; paper engine sleeve M;
# Paper page rank column. Freshness: stamps pipeline_health.power_trend_list
# green only after a verified publish; failures red-stamp and publish nothing.
#
# Required GitHub secrets (already configured for sibling ingests):
#   SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY

on:
  schedule:
    - cron: '0 10 1 * *'   # 06:00 ET (EDT)
    - cron: '0 11 1 * *'   # 06:00 ET (EST); idempotent double-fire across DST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute + log only, do not write (true/false)"
        required: false
        default: 'false'

concurrency:
  group: power-trend-list-monthly
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests

      - name: Unit tests (power trend rules, hand-computed cases)
        run: python3 scripts/test_power_trend_rules.py

      - name: Compute + publish the monthly Power Trend list
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN:                   ${{ github.event.inputs.dry_run || 'false' }}
        run: python3 scripts/compute_power_trend_list.py

      - name: Red stamp on failure
        if: failure()
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/upsert_pipeline_health.py power_trend_list - red "POWER-TREND-LIST-MONTHLY failed — see workflow run logs"
