# INDICATOR-DRILLS-DAILY — regenerates the auto-computed indicator drilldown bundle.
#
# WHY
# ───
# Hand-written DRILLS in MacroTilt_Macro_Overview_Page_v11.html cover ~17 of
# 38 v2 indicators. The other 17 get auto-computed KPIs + co-movement +
# release metadata via scripts/generate_indicator_drills.py. As
# indicator_history.json refreshes, the generated KPIs need to refresh too.
#
# SCHEDULE
# ────────
# Daily 23:00 UTC — after CYCLE-V2-DAILY (22:30 UTC) writes the latest
# cycle_v2.json and indicator_history.json.
#
# OUTPUTS
# ───────
# public/indicator_drills_generated.json — consumed by openIndicatorDrawer
# on the Macro Overview page.
#
# PUSH AUTH (2026-06-09)
# ─────────────────────
# main is a protected branch. Daily bots that push with the default
# GITHUB_TOKEN are rejected with GH006 ("protected branch hook declined"),
# which is why every run since early June failed at the commit step while
# the generator itself succeeded. We now check out and push with the admin
# bot token (MACROTILT_BOT_PAT) — admins are exempt from the required
# checks — and rebase-retry to survive races with other nightly bots.
# (Same fix as the engine / v10 / cycle workflows, per LESSONS 2026-06-01.)

name: INDICATOR-DRILLS-DAILY

on:
  schedule:
    - cron: "0 23 * * 1-5"      # weekdays 23:00 UTC
  workflow_dispatch: {}

concurrency:
  group: indicator-drills-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MACROTILT_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run generator
        run: python3 scripts/generate_indicator_drills.py
      - name: Commit if updated
        run: |
          if [[ -z "$(git status --porcelain public/indicator_drills_generated.json)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "macrotilt-bot"
          git config user.email "macrotilt-bot@users.noreply.github.com"
          git add public/indicator_drills_generated.json
          git commit -m "Indicator drills daily refresh — $(date -u +%Y-%m-%d) [skip ci]"
          # Rebase-retry to survive races with other nightly data bots.
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push attempt $i failed — rebasing onto latest main"
            git pull --rebase origin main || true
          done
          echo "ERROR: could not push after 5 attempts"; exit 1
