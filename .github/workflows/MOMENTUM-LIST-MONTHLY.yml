name: MOMENTUM-LIST-MONTHLY

# Pipeline: equity-momentum_list-monthly — the Momentum sleeve's monthly
# ranked list (Two-Sleeve build PR-1; spec approved 2026-07-14).
#
# Computes 12-1 momentum (Jegadeesh & Titman 1993) over the liquid US
# common-stock universe on the PRIOR month's last panel-complete day,
# owns the top quintile clamped 20-50, records the SPY-vs-200-day crash
# guard (Faber 2007) and a trailing-90d insider badge (display only).
# Rules mirror the cleared 22-year backtest (scripts/backtest_strategies.py,
# Strategy_Backtest_2026-07-14.xlsx) via shared scripts/momentum_rules.py.
#
# Writes public.momentum_list — append-only across rebalance_dates,
# delete+rewrite within one (idempotent; safe to re-fire).
#
# Schedule: 1st of the month 06:00 ET (schedule-normalization rule: monthly
# on the 1st, slow-data slot). Double cron across DST; idempotent.
#
# Consumers: Trading Scanner -> Momentum Sleeve panel (PR-3); paper engine
# momentum sleeve (PR-2). Freshness: stamps pipeline_health.momentum_list
# green only after a verified publish; failures red-stamp and publish nothing.
#
# Required GitHub secrets (already configured for sibling ingests):
#   SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY

on:
  schedule:
    - cron: '0 10 1 * *'   # 06:00 ET (EDT)
    - cron: '0 11 1 * *'   # 06:00 ET (EST); idempotent double-fire across DST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute + log only, do not write (true/false)"
        required: false
        default: 'false'

concurrency:
  group: momentum-list-monthly
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests

      - name: Unit tests (momentum rules, hand-computed cases)
        run: python3 scripts/test_momentum_rules.py

      - name: Compute + publish the monthly momentum list
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN:                   ${{ github.event.inputs.dry_run || 'false' }}
        run: python3 scripts/compute_momentum_list.py

      - name: Red stamp on failure
        if: failure()
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/upsert_pipeline_health.py momentum_list - red "MOMENTUM-LIST-MONTHLY failed — see workflow run logs"
