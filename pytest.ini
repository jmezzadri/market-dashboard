# Root pytest configuration (added with the Conviction Events engine,
# 2026-08-11). Before this file existed, a bare `python3 -m pytest` at the
# repo root ALWAYS blew up: collection imported
# scripts/test_power_trend_rules.py, a standalone self-executing check
# (run via `python -m scripts.test_power_trend_rules`) whose import-time
# sys.exit() aborts the pytest mainloop; it also pulled in the
# trading-scanner suite, which is run from trading-scanner/ on its own.
#
# Scope the root run to the engine suites — the "full suites" of record
# (see commit 87906a84: paper_portfolio/tests + tests/) plus the
# pytest-native divergence checks. The trading-scanner suite is unchanged:
# run it with `cd trading-scanner && python3 -m pytest tests`.
[pytest]
testpaths =
    paper_portfolio
    tests
    scripts/test_divergences.py
